tamb\xE9m e testar com cinco usu\xE1rios.")],"Uma boa iniciativa vem acompanhada de planejamento e valida\xE7\xE3o. Envolver a equipe garante seguran\xE7a, porque as informa\xE7\xF5es precisam corresponder \xE0s prescri\xE7\xF5es, e aumenta a chance de a ideia ser adotada."),d("parcial","Fa\xE7o a tabela s\xF3 para o Seu Joaquim, com base no que ele me contou sobre cada rem\xE9dio e seus hor\xE1rios.",[i("tania","preocupado","Voc\xEA conferiu os hor\xE1rios com a prescri\xE7\xE3o dele?")],"Responder \xE0 necessidade dele \xE9 positivo, mas montar a tabela apenas com base no relato pode reproduzir erros. Toda orienta\xE7\xE3o sobre medicamentos precisa ser conferida."),d("pouco","Guardo a ideia para propor no pr\xF3ximo semestre, quando eu tiver mais experi\xEAncia e conhecer melhor a equipe.",[i("joaquim","triste","Ah... t\xE1 bom.")],"Esperar o momento ideal costuma significar n\xE3o agir. A ideia era simples e \xFAtil e poderia ser desenvolvida agora, com apoio da equipe."),d("inadequada","Imprimo tabelas com hor\xE1rios comuns, como 8h e 20h, e distribuo na sala de espera para todos os idosos.",[f("Uma usu\xE1ria passa a tomar um rem\xE9dio no hor\xE1rio da tabela gen\xE9rica, e n\xE3o no hor\xE1rio prescrito.")],"Iniciativa sem valida\xE7\xE3o pode gerar risco. Materiais sobre medicamentos precisam ser individualizados e conferidos pela equipe.")]}],justificativa:"Iniciativa envolve perceber necessidades e oportunidades, propor a\xE7\xF5es e coloc\xE1-las em pr\xE1tica com planejamento. Em servi\xE7os de sa\xFAde, a iniciativa do estudante se torna segura e efetiva quando \xE9 comunicada e integrada \xE0 equipe.",paraRefletir:"Que necessidade voc\xEA j\xE1 percebeu no seu campo de pr\xE1tica e ainda n\xE3o comunicou a ningu\xE9m?"},{id:"m16",eixo:"e4",numero:16,habilidade:"Adaptabilidade",titulo:"Mudan\xE7a de rota",objetivo:"Ajustar-se rapidamente a uma mudan\xE7a de planos e adaptar orienta\xE7\xF5es \xE0 realidade de uma fam\xEDlia, sem abrir m\xE3o da seguran\xE7a.",contexto:"Est\xE1gio na Aten\xE7\xE3o Prim\xE1ria, com atividade cancelada e substitu\xEDda por visitas domiciliares.",situacaoProblema:"A atividade que voc\xEA preparou \xE9 cancelada de \xFAltima hora. Na visita domiciliar, a orienta\xE7\xE3o de alta n\xE3o cabe na realidade da fam\xEDlia.",comportamentos:["Redireciona o foco para o novo objetivo","Busca informa\xE7\xF5es sobre a nova situa\xE7\xE3o","Adapta o plano \xE0 realidade, com seguran\xE7a"],local:"Visita domiciliar \xB7 ter\xE7a, 9h",cena:"domicilio",personagens:["tania","zilda","neto"],medidor:"Flexibilidade",etapas:[{id:"m16e1",cena:"ubs",situacao:[f("Voc\xEA preparou durante a semana uma atividade educativa em uma escola do bairro. Na manh\xE3 do est\xE1gio, a escola cancela."),i("tania","neutro","Mudan\xE7a de planos: hoje voc\xEAs v\xE3o comigo nas visitas domiciliares. A primeira \xE9 na casa de Dona Zilda, que teve alta ontem.")],desafio:"Como voc\xEA reage \xE0 mudan\xE7a?",opcoes:[d("adequada","Aceito a mudan\xE7a, pergunto sobre o caso de Dona Zilda e o objetivo da visita e me preparo no caminho.",[i("tania","feliz","Ela teve alta com um medicamento novo e mora com o neto. O objetivo \xE9 ver como est\xE3o se organizando.")],"Adaptabilidade \xE9 ajustar-se rapidamente \xE0s mudan\xE7as, redirecionando a energia para o novo objetivo. Buscar informa\xE7\xF5es sobre a nova situa\xE7\xE3o mostra flexibilidade com responsabilidade."),d("parcial","Aceito, mas pe\xE7o para remarcar logo a atividade da escola, para n\xE3o perder o material que preparei durante a semana.",[i("tania","neutro","A gente v\xEA isso depois. Agora, vamos.")],"Preocupar-se com o trabalho preparado \xE9 leg\xEDtimo, mas o foco no plano anterior atrasa o engajamento na nova tarefa. Primeiro adaptar, depois retomar o que for poss\xEDvel."),d("pouco","Acompanho a enfermeira, mas comento com os colegas que o dia de est\xE1gio acabou sendo perdido.",[f("Voc\xEA chega \xE0 visita sem saber quem \xE9 Dona Zilda nem por que est\xE1 ali.")],"Seguir a mudan\xE7a sem engajamento reduz o aproveitamento da experi\xEAncia. A frustra\xE7\xE3o \xE9 compreens\xEDvel, mas tratar a nova atividade como perda impede de ver o que ela pode ensinar."),d("inadequada","Pe\xE7o para ficar na UBS adiantando os relat\xF3rios, j\xE1 que n\xE3o me preparei para fazer visitas hoje.",[i("tania","preocupado","Visita domiciliar faz parte da forma\xE7\xE3o, {nome}. \xC9 uma \xF3tima oportunidade.")],"Evitar a nova situa\xE7\xE3o por falta de preparo pr\xE9vio limita o desenvolvimento profissional. Na sa\xFAde, imprevistos s\xE3o frequentes, e a capacidade de se ajustar faz parte do trabalho.")]},{id:"m16e2",situacao:[f("Na casa de Dona Zilda. A orienta\xE7\xE3o de alta diz para guardar um dos medicamentos na geladeira. A geladeira est\xE1 quebrada h\xE1 uma semana."),i("zilda","preocupado","Eu deixo o rem\xE9dio em cima da mesa, meu bem. Geladeira, s\xF3 no m\xEAs que vem."),i("neto","neutro","A gente n\xE3o tem como comprar outra agora.")],desafio:"Como voc\xEA adapta a orienta\xE7\xE3o?",opcoes:[d("adequada","Converso sobre as possibilidades da casa e da vizinhan\xE7a e levo a situa\xE7\xE3o \xE0 Enf. T\xE2nia para definir uma alternativa segura.",[i("neto","aliviado","A vizinha da frente tem geladeira. Ela j\xE1 ajudou a gente antes."),i("tania","neutro","\xD3timo. Vou confirmar com a farm\xE1cia da UBS como esse medicamento pode ser armazenado at\xE9 l\xE1.")],"Adaptar \xE9 ajustar o plano \xE0 realidade da fam\xEDlia sem abrir m\xE3o da seguran\xE7a. Envolver a equipe garante que a alternativa seja adequada ao medicamento."),d("parcial","Repito a orienta\xE7\xE3o da alta e explico com calma por que o rem\xE9dio precisa ficar na geladeira, para a fam\xEDlia entender o risco.",[i("zilda","triste","Eu entendo, mas n\xE3o tenho geladeira...")],"Explicar a raz\xE3o \xE9 importante, mas repetir uma orienta\xE7\xE3o invi\xE1vel n\xE3o resolve. A orienta\xE7\xE3o precisa caber na realidade da fam\xEDlia."),d("pouco","Oriento guardar o rem\xE9dio no lugar mais fresco da casa, longe do sol, at\xE9 a geladeira ser consertada.",[i("tania","preocupado","Depende do medicamento. Isso precisa ser verificado antes de orientar.")],"A tentativa de adaptar \xE9 v\xE1lida, mas sugerir uma alternativa sem verificar as caracter\xEDsticas do medicamento pode comprometer a efic\xE1cia do tratamento."),d("inadequada","Registro que a fam\xEDlia n\xE3o conseguiu seguir a orienta\xE7\xE3o e sigo para a pr\xF3xima visita, que j\xE1 est\xE1 atrasada.",[f("Dona Zilda continua guardando o medicamento em cima da mesa.")],"Registrar sem agir responsabiliza a fam\xEDlia por uma condi\xE7\xE3o social e deixa o problema sem solu\xE7\xE3o. Adaptar o cuidado \xE0 realidade \xE9 parte da responsabilidade da equipe.")]}],justificativa:"Adaptabilidade \xE9 a capacidade de ajustar planos, comportamentos e estrat\xE9gias diante de mudan\xE7as e de realidades diferentes das previstas. Na Aten\xE7\xE3o Prim\xE1ria, adaptar as orienta\xE7\xF5es \xE0s condi\xE7\xF5es de vida das fam\xEDlias \xE9 condi\xE7\xE3o para um cuidado efetivo e seguro.",paraRefletir:"Lembre de uma mudan\xE7a de planos recente. O que voc\xEA fez nos primeiros minutos, e o que faria diferente?"},{id:"m17",eixo:"e4",numero:17,habilidade:"Autorregula\xE7\xE3o emocional",titulo:"Respirar antes de responder",objetivo:"Perceber as pr\xF3prias rea\xE7\xF5es emocionais, modular a resposta em uma situa\xE7\xE3o de tens\xE3o e buscar apoio adequado depois.",contexto:"Est\xE1gio na cl\xEDnica m\xE9dica, em um dia com intercorr\xEAncias que atrasaram a rotina.",situacaoProblema:"O acompanhante de um paciente grita com voc\xEA por causa de um atraso na medica\xE7\xE3o. Depois do turno, a cena continua mexendo com voc\xEA.",comportamentos:["Percebe as pr\xF3prias rea\xE7\xF5es","Mant\xE9m tom e postura calmos","Busca apoio em espa\xE7os adequados"],local:"Corredor da cl\xEDnica m\xE9dica \xB7 quinta, 11h",cena:"corredor",personagens:["valdir","marcos","bia"],medidor:"Equil\xEDbrio emocional",etapas:[{id:"m17e1",situacao:[f("A medica\xE7\xE3o do pai do Sr. Valdir est\xE1 atrasada por causa de uma intercorr\xEAncia no setor."),i("valdir","tenso","Voc\xEA de novo? Meu pai est\xE1 com dor h\xE1 meia hora! Voc\xEAs s\xE3o uns incompetentes! Vou denunciar todo mundo!"),f("Voc\xEA sente o rosto esquentar e o cora\xE7\xE3o acelerar.")],desafio:"Qual \xE9 a sua rea\xE7\xE3o?",opcoes:[d("adequada","Respiro fundo, mantenho a voz baixa, reconhe\xE7o a preocupa\xE7\xE3o dele e aciono agora o enfermeiro da medica\xE7\xE3o.",[i("valdir","neutro","...T\xE1. Mas r\xE1pido, por favor."),i("marcos","neutro","Sr. Valdir, estou indo agora at\xE9 o seu pai.")],"Perceber as pr\xF3prias rea\xE7\xF5es (rosto quente, cora\xE7\xE3o acelerado) e fazer uma pausa antes de responder \xE9 o n\xFAcleo da autorregula\xE7\xE3o emocional. A calma de quem atende ajuda a reduzir a tens\xE3o de quem est\xE1 aflito."),d("parcial","Explico que n\xE3o tenho culpa pelo atraso e que estou fazendo o meu melhor, para ele entender o que est\xE1 acontecendo no setor.",[i("valdir","tenso","Aqui ningu\xE9m tem culpa de nada!")],"Defender-se \xE9 uma rea\xE7\xE3o natural, mas tira o foco da necessidade do paciente e o coloca em voc\xEA. Responder \xE0 dor do pai, e n\xE3o \xE0 ofensa, tende a acalmar a situa\xE7\xE3o."),d("pouco","Fico em sil\xEAncio e me afasto, para n\xE3o piorar a discuss\xE3o enquanto ele est\xE1 t\xE3o alterado.",[f("O Sr. Valdir fica ainda mais irritado e vai ao posto reclamar.")],"Afastar-se pode ser uma forma de prote\xE7\xE3o, mas sem nenhuma resposta a necessidade dele fica sem encaminhamento. \xC9 poss\xEDvel pedir um momento e garantir que algu\xE9m responda."),d("inadequada","Digo com firmeza, no mesmo tom que ele, que ele n\xE3o pode falar assim com a equipe de enfermagem.",[i("valdir","tenso","Ah, agora vai gritar comigo tamb\xE9m?")],"Responder no mesmo tom aumenta o conflito e pode comprometer a seguran\xE7a de todos. Limites podem ser colocados, mas com voz calma e depois de acolher a necessidade.")]},{id:"m17e2",situacao:[f("No fim do turno, a cena continua na sua cabe\xE7a. Suas m\xE3os ainda tremem um pouco."),i("bia","preocupado","T\xE1 tudo bem? Voc\xEA n\xE3o falou mais nada depois daquela situa\xE7\xE3o.")],desafio:"O que voc\xEA faz com o que est\xE1 sentindo?",opcoes:[d("adequada","Converso com a Bia sobre como me senti e relato o epis\xF3dio \xE0 professora, perguntando como lidar com isso.",[i("bia","aliviado","Comigo tamb\xE9m j\xE1 aconteceu. A professora tem umas dicas boas."),f("Na conversa com a Profa. Helena, voc\xEA descobre que a universidade tem um servi\xE7o de apoio psicol\xF3gico para estudantes.")],"Reconhecer e nomear as emo\xE7\xF5es, buscar apoio e transformar a experi\xEAncia em aprendizagem s\xE3o estrat\xE9gias de autorregula\xE7\xE3o. Pedir ajuda \xE9 um comportamento profissional, e n\xE3o sinal de fraqueza."),d("parcial","Digo que est\xE1 tudo bem e tento esquecer o assunto, para n\xE3o levar o problema do est\xE1gio para casa.",[f("\xC0 noite, voc\xEA n\xE3o consegue dormir pensando na cena.")],"Suprimir as emo\xE7\xF5es pode funcionar no curto prazo, mas n\xE3o as resolve. Falar sobre o ocorrido ajuda a process\xE1-lo e a se preparar para situa\xE7\xF5es parecidas."),d("pouco","Desabafo no grupo de mensagens da turma, contando o que aconteceu, com detalhes do paciente e do acompanhante.",[i("bia","preocupado","Melhor apagar isso. Tem informa\xE7\xE3o do paciente a\xED.")],"Desabafar \xE9 saud\xE1vel, mas expor detalhes de pacientes, mesmo em grupos fechados, fere o sigilo profissional. Escolha pessoas e espa\xE7os adequados para falar sobre o que sentiu."),d("inadequada","Publico nas redes sociais um desabafo sobre acompanhantes mal-educados, citando o hospital onde fa\xE7o est\xE1gio.",[f("A publica\xE7\xE3o circula e chega \xE0 coordena\xE7\xE3o do curso.")],"Publica\xE7\xF5es sobre pacientes, familiares ou institui\xE7\xF5es nas redes sociais contrariam o C\xF3digo de \xC9tica dos Profissionais de Enfermagem e exp\xF5em pessoas. Regular as emo\xE7\xF5es inclui escolher como e onde expressar o que se sente.")]}],justificativa:"Autorregula\xE7\xE3o emocional \xE9 a capacidade de perceber as pr\xF3prias emo\xE7\xF5es, modular as rea\xE7\xF5es no momento e buscar estrat\xE9gias e apoio depois. Em situa\xE7\xF5es de tens\xE3o, ela protege a rela\xE7\xE3o com pacientes e familiares, a seguran\xE7a do cuidado e a sa\xFAde mental do estudante.",paraRefletir:"Quais sinais do seu corpo avisam que voc\xEA est\xE1 perdendo a calma? O que voc\xEA pode fazer nos primeiros dez segundos?"},{id:"m18",eixo:"e4",numero:18,habilidade:"Aprendizagem cont\xEDnua",titulo:"Depois do retorno",objetivo:"Receber um retorno com abertura, transform\xE1-lo em metas concretas e buscar atualiza\xE7\xE3o ativa em fontes confi\xE1veis.",contexto:"Avalia\xE7\xE3o final de um est\xE1gio e in\xEDcio de um novo campo de pr\xE1tica no semestre seguinte.",situacaoProblema:"A professora aponta que suas anota\xE7\xF5es de enfermagem est\xE3o incompletas. No est\xE1gio seguinte, voc\xEA descobre que um protocolo mudou em rela\xE7\xE3o ao que aprendeu em aula.",comportamentos:["Recebe cr\xEDticas com abertura","Transforma o retorno em metas concretas","Busca atualiza\xE7\xE3o em fontes oficiais"],local:"Sala de avalia\xE7\xE3o do est\xE1gio \xB7 sexta, 17h",cena:"sala-aula",personagens:["helena","marcos"],medidor:"Evolu\xE7\xE3o profissional",etapas:[{id:"m18e1",situacao:[f("Fim do est\xE1gio. Na avalia\xE7\xE3o individual, a Profa. Helena d\xE1 a voc\xEA um retorno."),i("helena","neutro","Seu cuidado com os pacientes foi muito bom. Mas suas anota\xE7\xF5es de enfermagem est\xE3o incompletas: faltam hor\xE1rios, dados objetivos e, \xE0s vezes, a sua identifica\xE7\xE3o.")],desafio:"Como voc\xEA recebe esse retorno?",opcoes:[d("adequada","Agrade\xE7o, pe\xE7o um exemplo de anota\xE7\xE3o minha que poderia melhorar e pergunto que refer\xEAncias devo estudar.",[i("helena","feliz",'Claro. Olha esta: "paciente bem, sem queixas". O que falta aqui? Vou te indicar as recomenda\xE7\xF5es do conselho sobre registros.')],"Receber cr\xEDticas com abertura e transform\xE1-las em perguntas espec\xEDficas \xE9 a base da aprendizagem cont\xEDnua. O retorno vira um plano concreto de melhoria."),d("parcial","Agrade\xE7o o retorno e digo que vou prestar mais aten\xE7\xE3o nas pr\xF3ximas anota\xE7\xF5es que eu fizer no est\xE1gio.",[i("helena","neutro","\xD3timo. O que exatamente voc\xEA vai fazer diferente?")],"A receptividade \xE9 positiva, mas uma inten\xE7\xE3o gen\xE9rica n\xE3o define o que mudar. Pedir exemplos e refer\xEAncias tornaria o retorno mais \xFAtil."),d("pouco","Explico que, no ritmo do est\xE1gio, n\xE3o havia tempo suficiente para registrar tudo com o n\xEDvel de detalhe esperado pela professora.",[i("helena","neutro","O tempo \xE9 curto mesmo. Justamente por isso o registro precisa ser objetivo.")],"O tempo \xE9 uma dificuldade real, mas us\xE1-lo como justificativa encerra a reflex\xE3o. O registro faz parte do cuidado, \xE9 um documento legal e merece investimento de aprendizagem."),d("inadequada","Comento que outros colegas escrevem as anota\xE7\xF5es do mesmo jeito e n\xE3o receberam essa cr\xEDtica.",[i("helena","preocupado","Estou falando das suas anota\xE7\xF5es, {nome}.")],"Comparar-se aos colegas desvia o foco do pr\xF3prio desenvolvimento e dificulta a aprendizagem. O retorno \xE9 uma oportunidade individual de crescimento.")]},{id:"m18e2",cena:"posto",situacao:[f("No semestre seguinte, voc\xEA come\xE7a um novo est\xE1gio. No primeiro dia, o Enf. Marcos avisa que o hospital atualizou o protocolo de preven\xE7\xE3o de les\xE3o por press\xE3o."),i("marcos","neutro","Algumas coisas s\xE3o diferentes do que voc\xEAs viram em aula. O protocolo novo est\xE1 na intranet.")],desafio:"Como voc\xEA lida com a atualiza\xE7\xE3o?",opcoes:[d("adequada","Leio o protocolo novo, comparo com o que aprendi, anoto as mudan\xE7as e tiro d\xFAvidas com o Enf. Marcos.",[i("marcos","feliz","Voc\xEA leu o protocolo inteiro? Isso ajuda at\xE9 a equipe, que ainda est\xE1 se adaptando.")],"Aprendizagem cont\xEDnua \xE9 buscar atualiza\xE7\xE3o de forma ativa, comparar o novo com o que j\xE1 se sabe e usar fontes institucionais e cient\xEDficas. Protocolos mudam com novas evid\xEAncias, e a pr\xE1tica precisa acompanhar."),d("parcial","Pergunto aos t\xE9cnicos de enfermagem o que mudou, j\xE1 que eles aplicam o protocolo todos os dias e aprendo mais r\xE1pido.",[i("marcos","neutro","Eles podem ajudar, mas leia tamb\xE9m o documento.")],"Aprender com a equipe \xE9 valioso, mas relatos podem ser incompletos. A leitura do protocolo oficial garante a informa\xE7\xE3o correta."),d("pouco","Sigo o que aprendi em aula, que \xE9 recente e foi baseado em refer\xEAncias cient\xEDficas bem fundamentadas.",[i("marcos","preocupado","Essa conduta mudou no protocolo, {nome}.")],"O conhecimento da gradua\xE7\xE3o \xE9 a base, mas se desatualiza. Manter pr\xE1ticas antigas por comodidade pode contrariar evid\xEAncias mais recentes e as normas da institui\xE7\xE3o."),d("inadequada","Deixo para ler os protocolos com calma depois da formatura, quando eu tiver mais tempo para estudar.",[f("Na semana seguinte, voc\xEA realiza uma conduta que n\xE3o \xE9 mais recomendada e recebe uma corre\xE7\xE3o.")],"Adiar a atualiza\xE7\xE3o \xE9 incompat\xEDvel com a pr\xE1tica segura. A aprendizagem cont\xEDnua come\xE7a na gradua\xE7\xE3o e acompanha toda a vida profissional.")]}],justificativa:"Aprendizagem cont\xEDnua envolve receber retornos com abertura, transform\xE1-los em metas concretas, buscar fontes confi\xE1veis e acompanhar atualiza\xE7\xF5es de protocolos e evid\xEAncias. \xC9 uma compet\xEAncia que sustenta a qualidade e a seguran\xE7a do cuidado ao longo da carreira.",paraRefletir:"Qual foi o \xFAltimo retorno que voc\xEA recebeu sobre o seu desempenho? Que meta concreta ele poderia gerar?"}];var La=["#F6D3B8","#E9B48
