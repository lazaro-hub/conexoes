<script>"use strict";(()=>{var bo=Object.create;var fe=Object.defineProperty;var xo=Object.getOwnPropertyDescriptor;var qo=Object.getOwnPropertyNames;var No=Object.getPrototypeOf,Co=Object.prototype.hasOwnProperty;var ge=(a,e)=>()=>(e||a((e={exports:{}}).exports,e),e.exports);var Eo=(a,e,o,r)=>{if(e&&typeof e=="object"||typeof e=="function")for(let s of qo(e))!Co.call(a,s)&&s!==o&&fe(a,s,{get:()=>e[s],enumerable:!(r=xo(e,s))||r.enumerable});return a};var ea=(a,e,o)=>(o=a!=null?bo(No(a)):{},Eo(e||!a||!a.__esModule?fe(o,"default",{value:a,enumerable:!0}):o,a));var oa=ge((Xo,ve)=>{ve.exports=window.React});var be=ge((Zo,he)=>{he.exports=window.ReactDOM});var co=ea(oa()),uo=ea(be());var W=ea(oa());var u=ea(oa());var f=a=>({quem:"narrador",texto:a}),i=(a,e,o)=>({quem:a,texto:o,humor:e}),yo={adequada:"a",parcial:"b",pouco:"c",inadequada:"d"},d=(a,e,o,r)=>({id:yo[a],nivel:a,texto:e,consequencia:o,feedback:r});var xe=[{id:"m01",eixo:"e1",numero:1,habilidade:"Comunica\xE7\xE3o",titulo:"O caderno do Seu Joaquim",objetivo:"Adaptar a orienta\xE7\xE3o ao n\xEDvel de compreens\xE3o do usu\xE1rio e confirmar o entendimento antes de encerrar.",contexto:"Est\xE1gio na Unidade B\xE1sica de Sa\xFAde, sob supervis\xE3o da Enf. T\xE2nia.",situacaoProblema:"Seu Joaquim recebeu o diagn\xF3stico de diabetes, tem dificuldade de leitura e saiu da consulta sem entender como registrar a glicemia em casa.",comportamentos:["Adapta a linguagem ao interlocutor","Usa exemplos concretos","Confirma a compreens\xE3o pedindo demonstra\xE7\xE3o"],local:"UBS Jardim das Flores \xB7 ter\xE7a, 9h",cena:"ubs",personagens:["joaquim","tania"],medidor:"Compreens\xE3o do usu\xE1rio",etapas:[{id:"m01e1",situacao:[f("A Enf. T\xE2nia pediu que voc\xEA reforce com Seu Joaquim as orienta\xE7\xF5es sobre o registro da glicemia no caderno. Ela acompanha a conversa da mesa ao lado."),i("joaquim","preocupado","Olha, {nome}, o m\xE9dico falou um monte de coisa. Hiperglicemia, jejum, p\xF3s-prandial... Eu balancei a cabe\xE7a, mas n\xE3o entendi foi nada."),i("tania","neutro","Ele estudou pouco e tem dificuldade para ler. Fique \xE0 vontade para conduzir, eu estou aqui.")],desafio:"Como voc\xEA inicia a orienta\xE7\xE3o?",opcoes:[d("adequada","Pergunto como ele mede hoje e explico com palavras do dia a dia, mostrando no pr\xF3prio caderno onde anotar.",[i("joaquim","aliviado",'Ah, ent\xE3o "em jejum" \xE9 antes do caf\xE9? Assim fica f\xE1cil. Eu anoto aqui, nessa coluna?')],"Partir do que a pessoa j\xE1 sabe e usar linguagem simples e objetos concretos adapta a mensagem ao letramento em sa\xFAde do usu\xE1rio. Comunica\xE7\xE3o efetiva se mede pelo que o outro compreende, e n\xE3o pela quantidade de informa\xE7\xE3o dita."),d("parcial","Explico com calma cada termo t\xE9cnico que o m\xE9dico usou, para que ele aprenda o vocabul\xE1rio certo e n\xE3o se confunda nas consultas.",[i("joaquim","preocupado","T\xE1... p\xF3s-prandial \xE9 depois do almo\xE7o. E glicemia capilar \xE9 a do dedo? \xC9 muita palavra, viu.")],"Ter calma ajuda, mas o foco ficou no vocabul\xE1rio t\xE9cnico e n\xE3o no que ele precisa fazer em casa. Para quem tem pouca escolaridade, priorizar poucas a\xE7\xF5es pr\xE1ticas \xE9 mais efetivo do que ensinar termos."),d("pouco","Entrego um folheto ilustrado sobre diabetes e sugiro que ele leia com a fam\xEDlia em casa, com mais tempo e tranquilidade.",[i("joaquim","tenso","Folheto... Minha neta l\xEA pra mim quando ela vem, mas ela s\xF3 vem no domingo.")],"Materiais escritos podem complementar, mas n\xE3o substituem a conversa, principalmente quando a pessoa tem dificuldade de leitura. Entregar o folheto sem checar se ele consegue us\xE1-lo transfere a orienta\xE7\xE3o para outra pessoa."),d("inadequada","Digo que ele n\xE3o precisa se preocupar com os nomes dif\xEDceis e que basta seguir o que o m\xE9dico mandou.",[i("joaquim","triste","Mas \xE9 isso que eu n\xE3o sei: o que ele mandou...")],"A frase tranquiliza por um instante, mas encerra a comunica\xE7\xE3o justamente onde est\xE1 a d\xFAvida. O usu\xE1rio sai sem saber o que fazer, o que aumenta o risco de erro no autocuidado.")]},{id:"m01e2",situacao:[f("Alguns minutos depois, Seu Joaquim olha para o rel\xF3gio. O \xF4nibus dele passa em 15 minutos."),i("joaquim","neutro","Entendi tudo, pode deixar. Agora eu preciso ir.")],desafio:"Como voc\xEA confirma se a orienta\xE7\xE3o foi compreendida?",opcoes:[d("adequada","Pe\xE7o que ele me mostre no caderno como vai anotar a medida de amanh\xE3 e o que far\xE1 se o n\xFAmero vier alto.",[i("joaquim","feliz","Amanh\xE3, antes do caf\xE9, eu furo o dedo e escrevo aqui. Se der muito alto, eu venho no posto ou ligo. Isso?"),i("tania","feliz","Isso mesmo. Bom trabalho, voc\xEAs dois.")],"Pedir que a pessoa explique ou demonstre com as pr\xF3prias palavras (t\xE9cnica de ensino de retorno, ou teach-back) \xE9 a forma mais confi\xE1vel de verificar a compreens\xE3o. Perguntas de sim ou n\xE3o costumam gerar respostas autom\xE1ticas."),d("parcial","Pergunto se ficou alguma d\xFAvida e, como ele diz que n\xE3o, encerro para que ele n\xE3o perca o \xF4nibus.",[i("joaquim","neutro","N\xE3o, n\xE3o. T\xE1 tudo certo."),f("No caminho, ele percebe que n\xE3o lembra em qual coluna anotar.")],"A pergunta \xE9 educada, mas permite uma resposta autom\xE1tica. Muitas pessoas dizem que n\xE3o t\xEAm d\xFAvidas por pressa ou vergonha. Um pedido de demonstra\xE7\xE3o revelaria o que ficou pouco claro."),d("pouco","Repito a explica\xE7\xE3o inteira mais uma vez, de forma r\xE1pida, para garantir que nenhuma informa\xE7\xE3o importante ficou de fora.",[i("joaquim","tenso","T\xE1 bom, t\xE1 bom... Eu vou perder o \xF4nibus.")],"Repetir n\xE3o confirma a compreens\xE3o e, com pressa, a mensagem chega ainda menos. A verifica\xE7\xE3o precisa vir do usu\xE1rio, e n\xE3o de mais fala de quem orienta."),d("inadequada","Encerro e registro no prontu\xE1rio que o usu\xE1rio foi orientado e compreendeu, para dar continuidade ao acompanhamento.",[i("tania","preocupado","{nome}, como voc\xEA verificou que ele compreendeu? O registro precisa refletir o que aconteceu de fato.")],"Registrar uma compreens\xE3o que n\xE3o foi verificada torna o registro impreciso, e o registro orienta toda a equipe. A conduta n\xE3o confirma o entendimento e ainda compromete a fidedignidade da anota\xE7\xE3o.")]}],justificativa:"A comunica\xE7\xE3o em sa\xFAde s\xF3 cumpre seu papel quando a pessoa consegue usar a informa\xE7\xE3o no dia a dia. Adaptar a linguagem ao letramento em sa\xFAde e confirmar a compreens\xE3o com a t\xE9cnica de ensino de retorno s\xE3o comportamentos observ\xE1veis que reduzem erros no autocuidado.",paraRefletir:'Pense em uma orienta\xE7\xE3o que voc\xEA j\xE1 deu ou recebeu. Sem perguntar "entendeu?", como voc\xEA saberia que a mensagem foi compreendida?'},{id:"m02",eixo:"e1",numero:2,habilidade:"Escuta ativa",titulo:"A campainha do leito 4",objetivo:"Demonstrar disponibilidade, aten\xE7\xE3o e compreens\xE3o diante da fala de uma paciente, mesmo em uma rotina com muitas tarefas.",contexto:"Est\xE1gio supervisionado na cl\xEDnica cir\xFArgica de um hospital geral.",situacaoProblema:'Dona Cida chama a equipe com frequ\xEAncia e j\xE1 recebeu o r\xF3tulo de "poliqueixosa". Ela ser\xE1 operada amanh\xE3 e quer conversar.',comportamentos:["Mostra disponibilidade com postura e olhar","Parafraseia o que ouviu","Faz perguntas abertas e encaminha as demandas"],local:"Cl\xEDnica cir\xFArgica \xB7 quarta, 16h",cena:"enfermaria",personagens:["cida","edson"],medidor:"Confian\xE7a da paciente",etapas:[{id:"m02e1",situacao:[f("Voc\xEA tem tr\xEAs tarefas pendentes quando a campainha do leito 4 toca pela terceira vez."),i("edson","tenso","\xC9 a Dona Cida de novo. Ela chama toda hora, \xE9 poliqueixosa. Vai l\xE1 rapidinho e volta."),i("cida","preocupado","Ah, que bom que veio. Senta aqui um pouquinho? \xC9 que amanh\xE3 cedo \xE9 a cirurgia, e eu fico pensando...")],desafio:"Ela come\xE7a a falar. O que voc\xEA faz?",opcoes:[d("adequada","Aviso que tenho alguns minutos agora, sento na altura dela e a deixo falar sem interromper.",[i("cida","aliviado","Obrigada por sentar. Voc\xEA \xE9 a primeira pessoa que senta comigo hoje.")],"Delimitar o tempo com honestidade e mostrar aten\xE7\xE3o com o corpo (sentar, olhar nos olhos) cria condi\xE7\xF5es para a escuta, mesmo em uma rotina corrida. Voc\xEA tamb\xE9m n\xE3o deixou que o r\xF3tulo dado pela equipe definisse a sua conduta."),d("parcial","Escuto em p\xE9, perto da porta, enquanto confiro a prescri\xE7\xE3o no tablet, para n\xE3o atrasar as outras tarefas da tarde.",[i("cida","preocupado","Ah... vejo que tem muita coisa pra fazer. N\xE3o \xE9 nada, n\xE3o. Pode ir.")],"Voc\xEA estava presente, mas a aten\xE7\xE3o dividida e a postura de sa\xEDda comunicaram que n\xE3o havia espa\xE7o para ela. Escuta ativa envolve postura, olhar e foco, e n\xE3o s\xF3 ouvir as palavras."),d("pouco","Digo que a cirurgia \xE9 simples e que vai dar tudo certo, para que ela consiga descansar melhor antes de amanh\xE3.",[i("cida","triste","\xC9... todo mundo fala isso.")],'A tranquiliza\xE7\xE3o precoce parece acolhedora, mas interrompe a fala e desconsidera o medo da pessoa. Al\xE9m disso, garantir que "vai dar tudo certo" \xE9 uma promessa que o estudante n\xE3o pode fazer.'),d("inadequada","Explico que tenho outras prioridades agora e que volto para conversar com calma assim que terminar as tarefas.",[f("Voc\xEA s\xF3 consegue voltar 40 minutos depois. Dona Cida est\xE1 chorando baixinho.")],'Adiar sem combinar um hor\xE1rio e sem perguntar o que ela precisava ignora a possibilidade de uma demanda importante. Chamados repetidos costumam sinalizar uma necessidade n\xE3o atendida, e n\xE3o apenas "queixa".')]},{id:"m02e2",situacao:[i("cida","triste","\xC9 que ningu\xE9m me explicou como vai ser amanh\xE3. E o meu marido morreu depois de uma cirurgia, sabe? Eu n\xE3o paro de pensar nisso.")],desafio:"Como voc\xEA responde ao que ela contou?",opcoes:[d("adequada","Devolvo o que entendi do medo dela, pergunto o que ela gostaria de saber e levo as d\xFAvidas ao enfermeiro respons\xE1vel.",[i("cida","aliviado","Isso, \xE9 isso mesmo. Queria saber se vou ficar acordada e quando vou ver minha filha."),f("Voc\xEA registra as d\xFAvidas e comunica ao enfermeiro, que passa no leito antes do jantar.")],"Parafrasear mostra que voc\xEA ouviu e permite que ela confirme ou corrija. As perguntas abertas revelam as necessidades reais, e levar as d\xFAvidas a quem pode respond\xEA-las respeita o limite de atua\xE7\xE3o do estudante."),d("parcial","Explico, com o que aprendi em aula, como costuma ser o pr\xE9-operat\xF3rio desse tipo de cirurgia, para ela saber o que esperar.",[i("cida","preocupado","Hum... mas e no meu caso? Eu vou ficar acordada?")],"A inten\xE7\xE3o de informar \xE9 boa, mas a resposta partiu do seu conhecimento e n\xE3o da d\xFAvida dela. Informa\xE7\xF5es gerais podem n\xE3o valer para o caso dela; o ideal \xE9 identificar as perguntas e lev\xE1-las ao profissional respons\xE1vel."),d("pouco","Conto que outra paciente fez a mesma cirurgia na semana passada e j\xE1 est\xE1 em casa, para ela ver que costuma dar certo.",[i("cida","neutro","Que bom pra ela...")],"Comparar experi\xEAncias desloca o foco para outra hist\xF3ria e n\xE3o responde ao medo dela. Al\xE9m disso, compartilhar informa\xE7\xF5es de outra paciente fere o sigilo."),d("inadequada","Mudo de assunto e pergunto sobre os netos, para tirar o foco do medo e anim\xE1-la um pouco.",[i("cida","triste","Os netos est\xE3o bem..."),f("Ela n\xE3o volta a falar da cirurgia, mas passa a noite acordada.")],"Mudar de assunto alivia o desconforto de quem escuta, mas silencia a preocupa\xE7\xE3o de quem fala. O medo continua presente, agora sem cuidado.")]}],justificativa:'Escuta ativa \xE9 um conjunto de comportamentos observ\xE1veis: disponibilidade, postura atenta, perguntas abertas, par\xE1frase e encaminhamento do que foi dito. Chamados frequentes podem sinalizar necessidades n\xE3o atendidas, e r\xF3tulos como "poliqueixosa" dificultam essa percep\xE7\xE3o.',paraRefletir:"Quando algu\xE9m fala com voc\xEA e voc\xEA est\xE1 com pressa, quais sinais do seu corpo mostram que voc\xEA n\xE3o est\xE1 ouvindo?"},{id:"m03",eixo:"e1",numero:3,habilidade:"Empatia",titulo:"Uma noite sem respostas",objetivo:"Reconhecer e validar a experi\xEAncia emocional de uma familiar e agir para atender sua necessidade, dentro do papel do estudante.",contexto:"Est\xE1gio na unidade de interna\xE7\xE3o pedi\xE1trica.",situacaoProblema:"Renata, m\xE3e de Davi (4 anos), passou a noite sem not\xEDcias sobre um exame do filho e aborda voc\xEA, irritada, logo no in\xEDcio do turno.",comportamentos:["Nomeia a emo\xE7\xE3o e a situa\xE7\xE3o do outro","Evita julgar a forma como o outro se expressa","Age para atender a necessidade, respeitando o seu papel"],local:"Corredor da pediatria \xB7 quinta, 7h30",cena:"corredor",personagens:["renata","marcos"],medidor:"V\xEDnculo com a fam\xEDlia",etapas:[{id:"m03e1",situacao:[f("Renata, m\xE3e de Davi, aborda voc\xEA assim que voc\xEA chega ao setor."),i("renata","tenso","Voc\xEA \xE9 da enfermagem? Estou aqui desde ontem esperando o resultado do exame do meu filho e ningu\xE9m me fala nada! Ningu\xE9m se importa!")],desafio:"Qual \xE9 a sua primeira resposta?",opcoes:[d("adequada","Reconhe\xE7o em voz alta que ela passou a noite preocupada e sem resposta, e pergunto como ela e o Davi est\xE3o agora.",[i("renata","triste","Cansa \xE9 pouco... Ele chorou a noite inteira e eu n\xE3o dormi nada.")],"Nomear o sentimento e a situa\xE7\xE3o, sem julgar o tom da m\xE3e, comunica compreens\xE3o. Empatia \xE9 reconhecer a perspectiva do outro e demonstrar isso em palavras e atitudes, sem precisar concordar com tudo."),d("parcial","Pe\xE7o desculpas em nome da equipe e explico que o laborat\xF3rio est\xE1 sobrecarregado, para ela entender o motivo da demora.",[i("renata","tenso","Sobrecarregado... E eu? Eu tamb\xE9m estou sobrecarregada.")],"Pedir desculpas pode ajudar, mas a explica\xE7\xE3o sobre o laborat\xF3rio coloca a institui\xE7\xE3o no centro antes de reconhecer a experi\xEAncia dela. Primeiro acolher a emo\xE7\xE3o, depois explicar."),d("pouco","Explico que n\xE3o estou respons\xE1vel pelo Davi hoje e que o enfermeiro do setor \xE9 quem pode dar as informa\xE7\xF5es a ela.",[i("renata","tenso","\xC9 sempre assim. Todo mundo empurra pra outra pessoa.")],'Indicar o respons\xE1vel \xE9 correto, mas fazer isso sem nenhum reconhecimento da situa\xE7\xE3o soa como "n\xE3o \xE9 comigo". \xC9 poss\xEDvel encaminhar e, ao mesmo tempo, mostrar que voc\xEA se importa.'),d("inadequada","Pe\xE7o que ela fale mais baixo, porque h\xE1 outras crian\xE7as dormindo no setor, e depois ou\xE7o o que ela tem a dizer.",[i("renata","tenso","Ah, agora o problema sou eu?")],"A preocupa\xE7\xE3o com o ambiente \xE9 leg\xEDtima, mas, como primeira resposta, invalida o sofrimento dela e tende a aumentar a tens\xE3o. Depois de acolher, voc\xEA pode convid\xE1-la para conversar em um lugar mais reservado.")]},{id:"m03e2",situacao:[i("renata","preocupado","Me fala a verdade. Voc\xEA acha que \xE9 grave? Voc\xEA deve saber alguma coisa.")],desafio:"Ela pede a sua opini\xE3o sobre o estado de sa\xFAde do filho. O que voc\xEA faz?",opcoes:[d("adequada","Explico que essa avalia\xE7\xE3o n\xE3o cabe a mim e vou com ela at\xE9 o Enf. Marcos, ficando ao lado dela na conversa.",[i("marcos","neutro","Renata, vamos sentar ali. Vou ver o resultado agora com a m\xE9dica e j\xE1 te explico."),i("renata","aliviado","Obrigada por n\xE3o me deixar sozinha nisso.")],"Voc\xEA reconheceu a necessidade dela e garantiu que a informa\xE7\xE3o viesse de quem tem compet\xEAncia para d\xE1-la, sem abandon\xE1-la no caminho. Empatia e limite de atua\xE7\xE3o caminham juntos."),d("parcial","Digo que n\xE3o posso falar sobre o diagn\xF3stico e que ela precisa aguardar a equipe m\xE9dica, que logo deve passar no quarto.",[i("renata","triste","Aguardar. T\xE1.")],"A resposta respeita o limite do estudante, mas deixa a m\xE3e sozinha com a ang\xFAstia. Faltou uma a\xE7\xE3o concreta, como acionar o enfermeiro ou combinar quando ela ter\xE1 retorno."),d("pouco","Digo que, pelo que observei no plant\xE3o, ele parece bem, e que provavelmente n\xE3o \xE9 nada grave.",[f("Mais tarde, o exame mostra que Davi precisar\xE1 de mais alguns dias de interna\xE7\xE3o. Renata fica confusa com as informa\xE7\xF5es diferentes.")],"A inten\xE7\xE3o de acalmar \xE9 compreens\xEDvel, mas opinar sobre a gravidade sem avalia\xE7\xE3o e sem compet\xEAncia para isso cria expectativas falsas e abala a confian\xE7a na equipe."),d("inadequada","Procuro o resultado no sistema e leio para ela o que est\xE1 escrito no laudo, para que ela n\xE3o fique sem informa\xE7\xE3o.",[i("marcos","tenso","{nome}, pare. Resultados s\xE3o discutidos com a fam\xEDlia pelo profissional respons\xE1vel, com contexto.")],"Ler um laudo sem interpreta\xE7\xE3o cl\xEDnica pode assustar ou confundir a fam\xEDlia, e comunicar resultados n\xE3o \xE9 atribui\xE7\xE3o do estudante. Ajudar de verdade \xE9 garantir que ela receba a informa\xE7\xE3o de quem pode explic\xE1-la.")]}],justificativa:"Empatia, na pr\xE1tica profissional, se expressa em comportamentos: reconhecer verbalmente a emo\xE7\xE3o, evitar julgamentos sobre o tom do outro e agir para atender a necessidade identificada, dentro dos limites de atua\xE7\xE3o.",paraRefletir:'Qual \xE9 a diferen\xE7a entre dizer "eu entendo" e mostrar que entendeu? Que frase voc\xEA usaria no lugar?'},{id:"m04",eixo:"e1",numero:4,habilidade:"Acolhimento",titulo:"Algu\xE9m para conversar",objetivo:"Receber uma demanda espont\xE2nea com escuta qualificada, privacidade e informa\xE7\xE3o honesta sobre o sigilo.",contexto:"Est\xE1gio na Unidade B\xE1sica de Sa\xFAde, apoiando o acolhimento.",situacaoProblema:'Pedro, de 16 anos, chega sozinho \xE0 UBS dizendo que precisa "falar com algu\xE9m", mas evita contar o motivo na frente de outras pessoas.',comportamentos:["Apresenta-se e valoriza a procura","Garante privacidade","Explica o sigilo e seus limites com honestidade"],local:"UBS Jardim das Flores \xB7 sexta, 10h",cena:"ubs",personagens:["pedro","tania"],medidor:"Confian\xE7a do adolescente",etapas:[{id:"m04e1",situacao:[f("A recep\xE7\xE3o est\xE1 cheia. Um adolescente se aproxima do balc\xE3o onde voc\xEA est\xE1 apoiando o acolhimento."),i("pedro","tenso","Oi... eu queria falar com algu\xE9m. N\xE3o \xE9 pra marcar consulta, n\xE3o. \xC9... uma coisa."),f("Ele olha para os lados. H\xE1 v\xE1rias pessoas perto do balc\xE3o.")],desafio:"Como voc\xEA o recebe?",opcoes:[d("adequada","Me apresento, digo que ele fez bem em vir e o convido para uma sala reservada, avisando a Enf. T\xE2nia.",[i("pedro","aliviado","Pode ser l\xE1 dentro, sim. Valeu.")],"Acolher come\xE7a na recep\xE7\xE3o: apresentar-se, valorizar a procura e garantir privacidade. Na frente de outras pessoas, um adolescente dificilmente falaria do que o trouxe."),d("parcial","Pe\xE7o que ele me conte baixinho ali mesmo, no canto do balc\xE3o, para eu entender a demanda e ver para onde encaminhar.",[i("pedro","tenso","Aqui fica dif\xEDcil..."),f("Voc\xEA percebe o desconforto e o leva para uma sala. Ele entra, mas fica mais fechado.")],"Querer entender a demanda \xE9 importante, mas a falta de privacidade inibe. Corrigir a rota foi bom; o ideal \xE9 oferecer o espa\xE7o reservado desde o in\xEDcio."),d("pouco","Pergunto se ele est\xE1 com algum respons\xE1vel, j\xE1 que \xE9 menor de idade, antes de seguir com o atendimento.",[i("pedro","tenso","Precisa? Minha m\xE3e t\xE1 trabalhando..."),f("Ele quase vai embora. A Enf. T\xE2nia se aproxima e o convida para uma sala.")],"Adolescentes t\xEAm direito a atendimento na unidade de sa\xFAde, inclusive desacompanhados, com respeito \xE0 privacidade. Come\xE7ar pela exig\xEAncia de um respons\xE1vel pode afast\xE1-lo justamente quando ele buscou ajuda."),d("inadequada","Pe\xE7o que ele pegue uma senha e aguarde ser chamado, para respeitar a ordem de quem j\xE1 estava esperando.",[f("Pedro pega a senha, senta por alguns minutos e sai antes de ser chamado. A Enf. T\xE2nia o alcan\xE7a na porta e o convida para conversar.")],"Tratar uma demanda espont\xE2nea e sens\xEDvel como rotina administrativa ignora os sinais de que ele precisava de escuta. Acolhimento \xE9 postura e pr\xE1tica de escuta qualificada, e n\xE3o apenas organiza\xE7\xE3o de fila.")]},{id:"m04e2",situacao:[f("Na sala, com a Enf. T\xE2nia presente, Pedro come\xE7a a falar e para no meio."),i("pedro","preocupado","Se eu contar, voc\xEAs v\xE3o falar pra minha m\xE3e?")],desafio:"Como voc\xEA responde \xE0 pergunta sobre sigilo?",opcoes:[d("adequada","Explico que a equipe mant\xE9m sigilo e que s\xF3 envolveria a fam\xEDlia diante de risco \xE0 vida dele, conversando com ele antes.",[i("pedro","aliviado","T\xE1. Ent\xE3o... eu ando muito ansioso, n\xE3o t\xF4 conseguindo dormir, e n\xE3o sei com quem falar."),i("tania","feliz","Obrigada por confiar na gente, Pedro. Vamos pensar juntos no que fazer.")],"Ser transparente sobre o sigilo e seus limites constr\xF3i confian\xE7a real. Promessas absolutas ou a amea\xE7a de contar aos pais quebram o v\xEDnculo; a verdade dita com cuidado o fortalece."),d("parcial","Digo que quem pode responder isso com seguran\xE7a \xE9 a Enf. T\xE2nia e deixo que ela conduza a conversa a partir da\xED.",[i("tania","neutro","Posso explicar, sim, Pedro."),f("Pedro se volta para a enfermeira e n\xE3o olha mais para voc\xEA.")],"Reconhecer a experi\xEAncia da enfermeira \xE9 adequado, mas voc\xEA poderia ter dado uma primeira resposta acolhedora, j\xE1 que ele dirigiu a pergunta a voc\xEA. Acolher tamb\xE9m \xE9 sustentar a conversa."),d("pouco","Prometo que nada do que ele disser vai sair desta sala, aconte\xE7a o que acontecer, para que ele se sinta seguro.",[i("pedro","aliviado","Promete mesmo?"),i("tania","preocupado","Pedro, deixa eu complementar o que foi dito...")],"A promessa de sigilo absoluto n\xE3o pode ser cumprida em situa\xE7\xF5es de risco, e quebr\xE1-la depois prejudicaria a confian\xE7a dele no servi\xE7o. O sigilo \xE9 um direito, mas tem limites que precisam ser explicados com honestidade."),d("inadequada","Explico que, como ele tem 16 anos, a fam\xEDlia precisa ser informada de qualquer coisa importante que ele contar.",[i("pedro","tenso","Ent\xE3o esquece. N\xE3o \xE9 nada.")],"Essa resposta desconsidera o direito do adolescente \xE0 privacidade e ao sigilo e provavelmente faz com que ele n\xE3o volte ao servi\xE7o. Envolver a fam\xEDlia pode ser necess\xE1rio em situa\xE7\xF5es de risco, mas isso \xE9 avaliado pela equipe e conversado com ele.")]}],justificativa:"Acolhimento \xE9 uma diretriz da Pol\xEDtica Nacional de Humaniza\xE7\xE3o: receber, escutar e dar uma resposta respons\xE1vel \xE0 necessidade da pessoa. Com adolescentes, privacidade e sigilo, com limites explicados de forma honesta, s\xE3o condi\xE7\xF5es para que a procura pelo servi\xE7o aconte\xE7a e se mantenha.",paraRefletir:"O que, no ambiente da sua unidade de est\xE1gio, facilita ou dificulta que uma pessoa se sinta acolhida logo na chegada?"}];var qe=[{id:"m05",eixo:"e2",numero:5,habilidade:"Lideran\xE7a",titulo:"Coordena\xE7\xE3o da manh\xE3",objetivo:"Planejar e distribuir o cuidado com crit\xE9rios, acompanhar a execu\xE7\xE3o e apoiar colegas com dificuldade.",contexto:"Est\xE1gio supervisionado na cl\xEDnica m\xE9dica, com a Profa. Helena.",situacaoProblema:"A professora pediu que voc\xEA coordene um grupo de quatro estudantes respons\xE1veis por seis pacientes, e um colega se sente inseguro com curativos.",comportamentos:["Planeja com base em crit\xE9rios","Delega considerando compet\xEAncias","Acompanha a execu\xE7\xE3o e oferece suporte"],local:"Cl\xEDnica m\xE9dica \xB7 segunda, 7h",cena:"posto",personagens:["helena","caio","bia"],medidor:"Organiza\xE7\xE3o do grupo",etapas:[{id:"m05e1",situacao:[f("Seu grupo tem quatro estudantes e seis pacientes para acompanhar na manh\xE3."),i("helena","neutro","{nome}, hoje voc\xEA coordena o grupo. Organize a divis\xE3o dos pacientes e me apresente em dez minutos."),i("caio","preocupado","Eu queria pegar s\xF3 os mais tranquilos. Ainda n\xE3o me sinto seguro com curativo.")],desafio:"Como voc\xEA organiza a divis\xE3o?",opcoes:[d("adequada","Vejo a complexidade de cada paciente, ou\xE7o o grupo e proponho uma divis\xE3o equilibrada, com o Caio em dupla. Levo \xE0 professora.",[i("bia","feliz","Gostei. Ningu\xE9m fica sobrecarregado e o Caio n\xE3o fica sozinho."),i("helena","feliz","Proposta clara. Podem seguir.")],"Liderar envolve reunir informa\xE7\xF5es, considerar a capacidade e o desenvolvimento de cada pessoa e validar decis\xF5es com quem supervisiona. A dupla com o Caio equilibra seguran\xE7a do paciente e aprendizagem."),d("parcial","Divido por ordem de leito, com o mesmo n\xFAmero de pacientes para cada estudante, para que a divis\xE3o seja justa e r\xE1pida.",[i("caio","tenso","Fiquei com os dois curativos mais complexos... sozinho.")],"A regra \xE9 simples e parece justa, mas ignora a complexidade dos pacientes e a experi\xEAncia de cada estudante. Igualdade de n\xFAmero nem sempre significa carga equilibrada."),d("pouco","Deixo cada um escolher os pacientes que preferir, para respeitar a autonomia do grupo, e fico com quem sobrar.",[f("Os pacientes mais complexos sobram para o final, e a escolha leva quinze minutos."),i("bia","preocupado","A professora j\xE1 est\xE1 vindo...")],"Dar autonomia ao grupo \xE9 positivo, mas abrir m\xE3o da coordena\xE7\xE3o quando ela foi solicitada deixa decis\xF5es importantes ao acaso. Quem lidera tamb\xE9m decide e assume a responsabilidade pela organiza\xE7\xE3o."),d("inadequada","Fico com os pacientes mais complexos, para garantir que tudo saia certo, e distribuo os demais entre os colegas.",[f("Voc\xEA fica com quatro pacientes. \xC0s 9h, dois cuidados ainda est\xE3o pendentes."),i("helena","preocupado","{nome}, por que voc\xEA est\xE1 com quatro pacientes?")],"Centralizar as tarefas dif\xEDceis sobrecarrega quem coordena, atrasa cuidados e tira dos colegas a oportunidade de aprender. Liderar \xE9 distribuir com crit\xE9rio, e n\xE3o fazer tudo.")]},{id:"m05e2",situacao:[f("10h. O Caio est\xE1 atrasado com a higiene do paciente do leito 12 e parece nervoso. Os demais est\xE3o adiantados."),i("caio","tenso","T\xE1 tudo bem, eu dou conta. S\xF3 t\xE1 demorando um pouco.")],desafio:"O que voc\xEA faz, como pessoa que coordena o grupo?",opcoes:[d("adequada","Converso com ele em particular, entendo a dificuldade e pe\xE7o \xE0 Bia, que terminou, que o ajude. Informo a professora.",[i("caio","aliviado","Valeu. Eu travei na mudan\xE7a de dec\xFAbito, ele \xE9 bem pesado."),i("bia","feliz","Vamos juntos, Caio.")],"Acompanhar o andamento, investigar a dificuldade com respeito e redistribuir recursos s\xE3o a\xE7\xF5es de lideran\xE7a. Comunicar o ajuste \xE0 supervis\xE3o mant\xE9m a transpar\xEAncia."),d("parcial","Assumo pessoalmente o paciente do Caio, para que o cuidado seja conclu\xEDdo logo e ele possa seguir com os outros.",[i("caio","triste","Ah... t\xE1 bom.")],"O cuidado \xE9 conclu\xEDdo, mas o colega perde a oportunidade de aprender e pode se sentir desqualificado. Oferecer apoio costuma ser melhor do que substituir."),d("pouco","Confio no que ele disse, para n\xE3o parecer que duvido da capacidade dele, e sigo com as minhas tarefas.",[f("\xC0s 11h, o paciente do leito 12 ainda aguarda a higiene. A professora percebe.")],"Respeitar a autonomia do colega \xE9 importante, mas os sinais de dificuldade estavam claros. Quem coordena acompanha o andamento e oferece ajuda antes que o atraso afete o paciente."),d("inadequada","Aviso o grupo que o Caio est\xE1 atrasado e pe\xE7o que todos se apressem, para n\xE3o prejudicar a avalia\xE7\xE3o de ningu\xE9m.",[i("caio","tenso","Valeu por me expor na frente de todo mundo.")],"Expor a dificuldade de um colega diante do grupo gera constrangimento e n\xE3o resolve o problema. A abordagem individual e respeitosa \xE9 mais efetiva e preserva a confian\xE7a.")]}],justificativa:"Lideran\xE7a, na forma\xE7\xE3o em Enfermagem, aparece em comportamentos como planejar com base em crit\xE9rios, delegar considerando compet\xEAncias, acompanhar a execu\xE7\xE3o e dar suporte. N\xE3o \xE9 um tra\xE7o inato, e sim uma pr\xE1tica que pode ser aprendida.",paraRefletir:"Lembre de algu\xE9m que liderou bem um grupo do qual voc\xEA participou. O que essa pessoa fazia, concretamente, que ajudava o grupo?"},{id:"m06",eixo:"e2",numero:6,habilidade:"Trabalho em equipe",titulo:"Cen\xE1rio de simula\xE7\xE3o",objetivo:"Organizar pap\xE9is e comunica\xE7\xE3o durante uma situa\xE7\xE3o simulada e analisar falhas como responsabilidade da equipe.",contexto:"Aula pr\xE1tica no laborat\xF3rio de simula\xE7\xE3o cl\xEDnica, com debriefing conduzido pela Profa. Helena.",situacaoProblema:"Em um cen\xE1rio simulado de paciente com falta de ar, os tr\xEAs estudantes agem ao mesmo tempo, sem divis\xE3o de fun\xE7\xF5es. No debriefing, uma colega culpa outro pela falha.",comportamentos:["Define e confirma pap\xE9is","Usa comunica\xE7\xE3o de al\xE7a fechada","Trata falhas como processo da equipe"],local:"Laborat\xF3rio de simula\xE7\xE3o \xB7 ter\xE7a, 14h",cena:"laboratorio",personagens:["rafael","julia","helena"],medidor:"Sintonia da equipe",etapas:[{id:"m06e1",situacao:[f("Cen\xE1rio: paciente simulado no p\xF3s-operat\xF3rio, com queixa de falta de ar. Voc\xEA, Rafael e J\xFAlia formam a equipe."),f("O cen\xE1rio come\xE7a. Os tr\xEAs v\xE3o ao mesmo tempo para perto do monitor."),i("rafael","tenso","A satura\xE7\xE3o t\xE1 caindo! Algu\xE9m faz alguma coisa!")],desafio:"Nos primeiros segundos, todos fazem a mesma coisa. Como voc\xEA age?",opcoes:[d("adequada","Distribuo as fun\xE7\xF5es em voz alta (paciente, sinais vitais, chamar ajuda e registro) e confirmo quem faz o qu\xEA.",[i("julia","neutro","Eu fico com os sinais vitais."),i("rafael","aliviado","Eu converso com ele e elevo a cabeceira.")],"Definir pap\xE9is e usar comunica\xE7\xE3o de al\xE7a fechada (dizer, confirmar e executar) evita esfor\xE7os repetidos e lacunas. Uma equipe eficiente \xE9 aquela em que cada pessoa conhece a pr\xF3pria fun\xE7\xE3o e a dos outros."),d("parcial","Come\xE7o a verificar os sinais vitais, que \xE9 o mais urgente, e espero que os colegas percebam o que falta fazer.",[f("A J\xFAlia tamb\xE9m come\xE7a a verificar os sinais vitais. Ningu\xE9m chama ajuda nos primeiros dois minutos.")],"Agir \xE9 melhor do que ficar parado, mas, sem combinar pap\xE9is, a equipe continua descoordenada. Nesse tipo de situa\xE7\xE3o, comunicar \xE9 t\xE3o importante quanto executar."),d("pouco","Tento fazer tudo pessoalmente, porque explicar as tarefas para os colegas agora tomaria um tempo precioso.",[f("Voc\xEA verifica os sinais, eleva a cabeceira e tenta chamar ajuda ao mesmo tempo. Rafael e J\xFAlia ficam olhando, sem saber como ajudar.")],"A\xE7\xF5es centralizadas sobrecarregam uma pessoa e deixam as outras sem fun\xE7\xE3o, o que atrasa o cuidado. Trabalhar em equipe \xE9 coordenar o esfor\xE7o de todos."),d("inadequada","Espero o Rafael, que percebeu primeiro a queda da satura\xE7\xE3o, decidir o que a equipe vai fazer.",[i("rafael","tenso","Eu? Eu n\xE3o sei por onde come\xE7ar!")],"Esperar que outra pessoa assuma, sem contribuir, deixa a equipe parada em um momento cr\xEDtico. Todos s\xE3o respons\xE1veis por mover o grupo, ainda que algu\xE9m coordene.")]},{id:"m06e2",situacao:[f("No debriefing, a Profa. Helena pergunta o que poderia ter sido melhor."),i("julia","tenso","O Rafael esqueceu de conferir a pulseira de identifica\xE7\xE3o antes de tudo. Foi isso."),i("rafael","triste","...")],desafio:"Como voc\xEA contribui para a discuss\xE3o?",opcoes:[d("adequada","Digo que conferir a identifica\xE7\xE3o era tarefa de toda a equipe e proponho combinar quem faz isso no pr\xF3ximo cen\xE1rio.",[i("helena","feliz","Essa \xE9 a pergunta certa: o que a equipe faz para que isso n\xE3o dependa da mem\xF3ria de uma pessoa."),i("rafael","aliviado","Valeu. Na pr\xF3xima eu fico com essa checagem.")],"Analisar falhas como processos da equipe, e n\xE3o como culpa individual, fortalece a confian\xE7a e melhora a seguran\xE7a do paciente. \xC9 o princ\xEDpio da cultura justa aplicado \xE0 aprendizagem."),d("parcial","Concordo que faltou conferir a identifica\xE7\xE3o e sugiro que o Rafael preste mais aten\xE7\xE3o nesse ponto da pr\xF3xima vez.",[i("rafael","triste","T\xE1... vou prestar.")],'Identificar a falha \xE9 \xFAtil, mas atribu\xED-la a um s\xF3 colega ignora que toda a equipe poderia ter verificado. Solu\xE7\xF5es que dependem apenas de "prestar mais aten\xE7\xE3o" s\xE3o fr\xE1geis.'),d("pouco","Fico em sil\xEAncio, para n\xE3o expor ainda mais o Rafael nem criar um clima ruim entre os colegas na frente da professora.",[i("helena","neutro","Mais algu\xE9m? ... Tudo bem."),f("O tema fica sem conclus\xE3o.")],"Evitar o conflito parece proteger o grupo, mas o debriefing \xE9 o momento de aprender juntos. O sil\xEAncio deixa o colega sozinho com a culpa e impede que a equipe construa uma solu\xE7\xE3o."),d("inadequada","Comento que eu teria conferido a pulseira se tivesse ficado com essa parte, para mostrar que o erro era evit\xE1vel.",[i("rafael","tenso","F\xE1cil falar depois.")],"Destacar o pr\xF3prio desempenho em cima do erro do colega enfraquece a confian\xE7a do grupo. O foco do debriefing \xE9 a aprendizagem coletiva, e n\xE3o a compara\xE7\xE3o.")]}],justificativa:"Trabalho em equipe envolve objetivos compartilhados, pap\xE9is definidos, comunica\xE7\xE3o clara e responsabilidade coletiva pelos resultados. Na simula\xE7\xE3o cl\xEDnica, analisar falhas como processos da equipe favorece a seguran\xE7a do paciente.",paraRefletir:"Em um trabalho em grupo recente, os pap\xE9is estavam claros para todos? O que teria mudado se estivessem?"},{id:"m07",eixo:"e2",numero:7,habilidade:"Colabora\xE7\xE3o",titulo:"Tr\xEAs cursos, uma a\xE7\xE3o",objetivo:"Construir com estudantes de outras \xE1reas um produto comum, integrando saberes e compartilhando informa\xE7\xF5es de forma construtiva.",contexto:"Projeto de extens\xE3o interprofissional com estudantes de Fisioterapia e Nutri\xE7\xE3o.",situacaoProblema:"O grupo precisa planejar uma a\xE7\xE3o educativa sobre preven\xE7\xE3o de quedas para idosos da UBS. Cada curso chega com uma ideia pr\xF3pria, e um material produzido por uma colega traz um risco que voc\xEA percebe.",comportamentos:["Define objetivos comuns","Valoriza os saberes de cada \xE1rea","Compartilha informa\xE7\xF5es relevantes de forma construtiva"],local:"Sala de reuni\xF5es do projeto \xB7 quarta, 17h",cena:"reuniao",personagens:["lara","vitor"],medidor:"Integra\xE7\xE3o do grupo",etapas:[{id:"m07e1",situacao:[f("Voc\xEA representa a Enfermagem na organiza\xE7\xE3o de uma a\xE7\xE3o educativa sobre preven\xE7\xE3o de quedas para idosos da UBS."),i("lara","neutro","Na Fisio, a gente pensou em fazer exerc\xEDcios de equil\xEDbrio com o grupo."),i("vitor","neutro","E da Nutri\xE7\xE3o d\xE1 pra falar de alimenta\xE7\xE3o e for\xE7a muscular."),f("O seu grupo de Enfermagem j\xE1 tinha um roteiro pronto sobre seguran\xE7a em casa e uso de medicamentos.")],desafio:"Como voc\xEA conduz a constru\xE7\xE3o da a\xE7\xE3o?",opcoes:[d("adequada","Apresento nosso roteiro como ponto de partida e proponho montarmos juntos um \xFAnico encontro, com objetivos comuns.",[i("lara","feliz","Assim a gente conecta tudo: o rem\xE9dio que d\xE1 tontura, o tapete solto e o exerc\xEDcio de equil\xEDbrio."),i("vitor","feliz","Fechou.")],"Colaborar \xE9 construir com o outro um produto comum, valorizando os saberes de cada \xE1rea. Definir o objetivo compartilhado antes de dividir tarefas evita uma a\xE7\xE3o fragmentada."),d("parcial","Proponho que cada curso apresente a sua parte separadamente, em sequ\xEAncia, para facilitar a organiza\xE7\xE3o do encontro.",[i("vitor","neutro","Pode ser. Vinte minutos para cada um, ent\xE3o.")],"A proposta \xE9 organizada e inclui todos, mas resulta em tr\xEAs falas paralelas, sem integra\xE7\xE3o. Para os idosos, a conex\xE3o entre os temas torna a a\xE7\xE3o mais significativa."),d("pouco","Sugiro usar o nosso roteiro, que j\xE1 est\xE1 pronto e revisado, e que eles complementem no final, se houver tempo.",[i("lara","tenso","Ent\xE3o a gente \xE9 s\xF3 complemento?")],"Priorizar o pr\xF3prio material pode economizar tempo, mas desvaloriza a contribui\xE7\xE3o das outras \xE1reas e reduz a participa\xE7\xE3o dos colegas. Colabora\xE7\xE3o exige abertura para mudar o pr\xF3prio plano."),d("inadequada","Proponho que a Enfermagem conduza a a\xE7\xE3o sozinha, j\xE1 que preven\xE7\xE3o de quedas \xE9 um tema central da nossa \xE1rea.",[i("vitor","tenso","U\xE9. Ent\xE3o a gente foi convidado pra qu\xEA?")],"Reivindicar o tema como exclusivo de uma profiss\xE3o contraria a l\xF3gica do cuidado interprofissional. Quedas em pessoas idosas t\xEAm m\xFAltiplas causas e se beneficiam do olhar de v\xE1rias \xE1reas.")]},{id:"m07e2",situacao:[f("Na v\xE9spera da a\xE7\xE3o, a Lara compartilha um v\xEDdeo de exerc\xEDcios. Um deles \xE9 feito em p\xE9, sem apoio, e voc\xEA sabe que alguns idosos do grupo usam bengala."),i("lara","feliz","O que acharam? Gravei ontem!")],desafio:"Como voc\xEA compartilha sua observa\xE7\xE3o?",opcoes:[d("adequada","Elogio o v\xEDdeo, conto que alguns participantes usam bengala e pergunto \xE0 Lara se d\xE1 para adaptar o exerc\xEDcio.",[i("lara","feliz","Boa! D\xE1 pra fazer com apoio no encosto da cadeira. Vou regravar essa parte.")],"Compartilhar informa\xE7\xF5es relevantes de forma construtiva, reconhecendo o trabalho do outro, \xE9 um comportamento central da colabora\xE7\xE3o. A observa\xE7\xE3o aumenta a seguran\xE7a da a\xE7\xE3o e preserva a parceria."),d("parcial","Elogio o v\xEDdeo e, no dia da a\xE7\xE3o, aviso os idosos que usam bengala para n\xE3o fazerem esse exerc\xEDcio espec\xEDfico.",[f("No dia, tr\xEAs idosos ficam sentados, olhando os outros, durante parte da atividade.")],"Voc\xEA protegeu os participantes, mas resolveu por conta pr\xF3pria um problema que poderia ter sido resolvido em conjunto e com melhor resultado. Compartilhar antes permitiria adaptar o exerc\xEDcio para todos."),d("pouco","Falo com o professor do projeto para que ele pe\xE7a \xE0 Lara que mude o v\xEDdeo, sem criar constrangimento entre n\xF3s.",[i("lara","triste","Por que voc\xEA n\xE3o falou comigo direto?")],"Acionar a supervis\xE3o pode ser necess\xE1rio em alguns casos, mas aqui a conversa direta seria mais simples e respeitosa. Contornar a colega enfraquece a parceria."),d("inadequada","N\xE3o comento nada, j\xE1 que exerc\xEDcios s\xE3o da \xE1rea da Fisioterapia e a Lara tem mais conhecimento sobre isso.",[f("No dia, uma participante se desequilibra durante o exerc\xEDcio e \xE9 amparada a tempo.")],"Respeitar a especialidade do outro n\xE3o significa omitir uma informa\xE7\xE3o de seguran\xE7a que voc\xEA tem. Na colabora\xE7\xE3o, cada pessoa contribui com o que observa, inclusive quando o tema \xE9 de outra \xE1rea.")]}],justificativa:"Colabora\xE7\xE3o interprofissional envolve objetivos comuns, reconhecimento dos saberes de cada profiss\xE3o e troca respeitosa de informa\xE7\xF5es. Essa compet\xEAncia est\xE1 associada a um cuidado mais seguro e integral.",paraRefletir:"Que conhecimento de outra profiss\xE3o da sa\xFAde j\xE1 mudou a forma como voc\xEA entende um cuidado de Enfermagem?"},{id:"m08",eixo:"e2",numero:8,habilidade:"Negocia\xE7\xE3o",titulo:"Dois s\xE1bados de campanha",objetivo:"Identificar interesses por tr\xE1s das posi\xE7\xF5es, buscar op\xE7\xF5es de ganho m\xFAtuo e formalizar um acordo claro.",contexto:"Organiza\xE7\xE3o do grupo de est\xE1gio para uma campanha de vacina\xE7\xE3o na UBS.",situacaoProblema:"O grupo precisa cobrir dois s\xE1bados de campanha, com pelo menos duas pessoas por dia. Cada estudante tem restri\xE7\xF5es diferentes, e voc\xEA tamb\xE9m tem um compromisso.",comportamentos:["Separa posi\xE7\xF5es de interesses","Gera op\xE7\xF5es antes de decidir","Formaliza e valida o acordo"],local:"Sala de aula \xB7 quinta, 12h",cena:"sala-aula",personagens:["bia","rafael","helena"],medidor:"Acordo do grupo",etapas:[{id:"m08e1",situacao:[f("O grupo precisa cobrir dois s\xE1bados de campanha de vacina\xE7\xE3o na UBS, com pelo menos duas pessoas em cada dia. Voc\xEA tem um compromisso familiar no segundo s\xE1bado."),i("bia","preocupado","Eu trabalho s\xE1bado de manh\xE3. Se eu faltar, perco o emprego."),i("rafael","tenso","Todo mundo tem compromisso. Vamos sortear e pronto, \xE9 o mais justo.")],desafio:"Como voc\xEA conduz a negocia\xE7\xE3o?",opcoes:[d("adequada","Proponho que cada um diga o que precisa e por qu\xEA, incluindo o meu compromisso, antes de pensar em op\xE7\xF5es.",[i("bia","aliviado","Eu s\xF3 n\xE3o posso de manh\xE3. \xC0 tarde eu consigo!"),i("rafael","neutro","T\xE1, faz sentido ver as possibilidades antes.")],'Negociar bem \xE9 separar posi\xE7\xF5es ("vamos sortear", "n\xE3o posso") de interesses (manter o emprego, ter justi\xE7a). Quando os interesses aparecem, surgem op\xE7\xF5es que atendem a todos.'),d("parcial","Aceito o sorteio, mas pe\xE7o que a Bia seja liberada por causa do trabalho, j\xE1 que o caso dela \xE9 mais s\xE9rio que os outros.",[i("rafael","tenso","A\xED n\xE3o \xE9 sorteio, n\xE9?")],"Voc\xEA considerou a necessidade da colega, mas tentou ajustar a solu\xE7\xE3o de uma pessoa sem ouvir os interesses de todos. Isso gera sensa\xE7\xE3o de privil\xE9gio e enfraquece o acordo."),d("pouco","Concordo com o sorteio e sugiro que quem n\xE3o puder no dia sorteado troque depois com algum colega.",[i("bia","triste","Ent\xE3o eu \xE9 que vou ter que me virar.")],"Transferir o conflito para depois apenas adia o problema e penaliza quem tem menos flexibilidade. Um acordo precisa ser vi\xE1vel para todos no momento em que \xE9 feito."),d("inadequada","Escolho logo o primeiro s\xE1bado, j\xE1 que tenho um compromisso no segundo, e deixo os demais se organizarem.",[i("rafael","tenso","Ah, ent\xE3o quem fala primeiro escolhe?")],"Defender apenas o pr\xF3prio interesse rompe o esp\xEDrito da negocia\xE7\xE3o e reduz a confian\xE7a no grupo. Seu compromisso \xE9 leg\xEDtimo, mas precisa entrar na conversa junto com o dos outros.")]},{id:"m08e2",situacao:[f("Surge uma proposta: a Bia fica com as tardes dos dois s\xE1bados, Rafael e Caio com as manh\xE3s, e voc\xEA cobre o primeiro s\xE1bado inteiro."),i("rafael","neutro","Por mim, fechou. Mas e se algu\xE9m faltar?")],desafio:"Como voc\xEA finaliza o acordo?",opcoes:[d("adequada","Resumo o combinado, definimos substitutos para imprevistos, registramos por escrito e levamos \xE0 professora.",[i("helena","feliz","Divis\xE3o clara e com plano B. Aprovado.")],"Um acordo se sustenta quando \xE9 claro, registrado e validado por quem precisa autoriz\xE1-lo. Antecipar imprevistos faz parte da negocia\xE7\xE3o."),d("parcial","Registro a divis\xE3o no grupo de mensagens da turma e pe\xE7o que cada um avise a professora sobre o seu dia.",[f("Dois colegas esquecem de avisar, e a professora descobre a mudan\xE7a na v\xE9spera.")],"Registrar foi importante, mas a falta de uma valida\xE7\xE3o conjunta e de um plano para faltas deixa o acordo fr\xE1gil."),d("pouco","Digo que, se algu\xE9m faltar, a gente resolve na hora, porque o grupo sempre deu um jeito nessas situa\xE7\xF5es.",[f("No segundo s\xE1bado, o Caio adoece. Ningu\xE9m sabe quem deveria substitu\xED-lo.")],"Deixar o imprevisto sem combina\xE7\xE3o \xE9 contar com a sorte. Negociar inclui antecipar riscos e definir responsabilidades."),d("inadequada","Fecho o acordo e, ao avisar a professora, digo que fui eu quem organizou tudo, para facilitar a comunica\xE7\xE3o.",[i("bia","tenso","Foi todo mundo junto, n\xE9?")],"Assumir individualmente o m\xE9rito de uma constru\xE7\xE3o coletiva compromete a confian\xE7a do grupo e as pr\xF3ximas negocia\xE7\xF5es.")]}],justificativa:"Negocia\xE7\xE3o envolve identificar os interesses por tr\xE1s das posi\xE7\xF5es, gerar op\xE7\xF5es de ganho m\xFAtuo e formalizar acordos claros. Na Enfermagem, essa habilidade aparece na organiza\xE7\xE3o de escalas, na divis\xE3o de tarefas e na constru\xE7\xE3o de planos de cuidado com usu\xE1rios e fam\xEDlias.",paraRefletir:"Em uma negocia\xE7\xE3o recente da sua vida, qual era a posi\xE7\xE3o da outra pessoa e qual era o interesse por tr\xE1s dela?"},{id:"m09",eixo:"e2",numero:9,habilidade:"Manejo de conflitos",titulo:"Tens\xE3o no posto",objetivo:"Reduzir a tens\xE3o de um conflito no momento em que ele ocorre e conduzir uma conversa que trate suas causas.",contexto:"Est\xE1gio na cl\xEDnica m\xE9dica, durante o hor\xE1rio de medica\xE7\xE3o.",situacaoProblema:"Um t\xE9cnico de enfermagem sobrecarregado e uma colega de est\xE1gio discutem em voz alta no posto de enfermagem, \xE0 vista de pacientes e familiares.",comportamentos:["Reduz a tens\xE3o no momento","Escolhe local e hora adequados","Descreve fatos e prop\xF5e acordos"],local:"Posto de enfermagem \xB7 segunda, 10h",cena:"posto",personagens:["edson","julia","marcos"],medidor:"Clima da equipe",etapas:[{id:"m09e1",situacao:[f("Hor\xE1rio de medica\xE7\xE3o. A J\xFAlia pediu ao Sr. Edson que conferisse um material com ela."),i("edson","tenso","Estudante s\xF3 atrasa a gente! Eu tenho doze pacientes e voc\xEAs ficam perguntando o tempo todo!"),i("julia","tenso","A gente est\xE1 aprendendo! O senhor n\xE3o precisa falar assim!"),f("Familiares no corredor olham para o posto.")],desafio:"A discuss\xE3o acontece na frente de pacientes e familiares. O que voc\xEA faz?",opcoes:[d("adequada","Reconhe\xE7o a press\xE3o do Sr. Edson e proponho levar a d\xFAvida \xE0 supervis\xE3o e continuar a conversa depois, em particular.",[i("edson","neutro","...T\xE1. Depois da medica\xE7\xE3o a gente v\xEA isso."),i("julia","aliviado","Tudo bem.")],"Interromper a escalada, reconhecer a press\xE3o vivida pelo outro e levar a conversa para um espa\xE7o reservado protegem os pacientes e as pessoas envolvidas. Manejar conflitos come\xE7a por reduzir a tens\xE3o do momento."),d("parcial","Levo a J\xFAlia para fora do posto, sem dizer nada ao Sr. Edson, para tirar a colega daquela situa\xE7\xE3o o quanto antes.",[i("julia","tenso","Por que voc\xEA me tirou de l\xE1? Ele \xE9 que estava errado!")],"Sair da cena reduz a exposi\xE7\xE3o, mas tomar partido em sil\xEAncio deixa a outra pessoa sem resposta e o conflito sem caminho para ser resolvido."),d("pouco","Defendo a J\xFAlia na hora, dizendo ao Sr. Edson que estudantes t\xEAm direito de aprender e que ele est\xE1 sendo grosseiro com ela.",[i("edson","tenso","Agora s\xE3o dois contra um? \xD3timo.")],"A defesa da colega \xE9 compreens\xEDvel, mas, feita no calor do momento e em p\xFAblico, amplia o conflito e refor\xE7a a ideia de lados opostos."),d("inadequada","Continuo minhas tarefas sem intervir, porque a discuss\xE3o \xE9 entre eles e minha entrada poderia piorar o clima.",[f('A discuss\xE3o continua por mais um minuto. Uma familiar comenta: "Nossa, que clima."')],"Ignorar um conflito p\xFAblico n\xE3o o resolve e permite que ele afete os pacientes e a imagem da equipe. Intervir com calma \xE9 uma responsabilidade de quem est\xE1 presente.")]},{id:"m09e2",situacao:[f("Depois da medica\xE7\xE3o, o clima ainda est\xE1 pesado. O Enf. Marcos chama voc\xEA."),i("marcos","neutro","Fiquei sabendo de uma discuss\xE3o no posto. Voc\xEAs querem conversar sobre isso?")],desafio:"Como voc\xEA contribui para resolver a situa\xE7\xE3o?",opcoes:[d("adequada","Proponho uma conversa entre os tr\xEAs e o Enf. Marcos, com fatos, necessidades de cada lado e um hor\xE1rio fixo para d\xFAvidas.",[i("edson","aliviado","Se tiver um hor\xE1rio pra d\xFAvida, fica melhor pra mim tamb\xE9m. Desculpa pelo jeito, J\xFAlia."),i("julia","aliviado","Eu tamb\xE9m me exaltei.")],"Descrever fatos, expressar necessidades e propor acordos concretos \xE9 a base da comunica\xE7\xE3o n\xE3o violenta e do manejo construtivo de conflitos. O combinado resolve a causa, e n\xE3o s\xF3 o epis\xF3dio."),d("parcial","Sugiro que a J\xFAlia pe\xE7a desculpas ao Sr. Edson, j\xE1 que ela tamb\xE9m se exaltou, para encerrar logo o assunto.",[i("julia","triste","S\xF3 eu?")],"Encerrar r\xE1pido parece pacificar, mas uma solu\xE7\xE3o unilateral n\xE3o trata a causa (a sobrecarga e a falta de um momento para d\xFAvidas) e pode gerar ressentimento."),d("pouco","Conto ao Enf. Marcos a minha vers\xE3o dos fatos, destacando o comportamento do Sr. Edson com a J\xFAlia.",[i("marcos","neutro","Vou ouvir tamb\xE9m o Sr. Edson antes de qualquer coisa.")],"Levar o caso \xE0 supervis\xE3o \xE9 v\xE1lido, mas apresentar apenas um lado transforma a conversa em den\xFAncia e dificulta uma solu\xE7\xE3o conjunta."),d("inadequada","Digo que a situa\xE7\xE3o j\xE1 passou e que voltar ao assunto agora s\xF3 traria mais desgaste para a equipe.",[f("Na semana seguinte, uma nova discuss\xE3o acontece pelo mesmo motivo.")],"Evitar a conversa deixa intacta a causa do conflito, que tende a se repetir. Conflitos bem manejados podem melhorar a organiza\xE7\xE3o da equipe.")]}],justificativa:"Conflitos fazem parte do trabalho em sa\xFAde. Manej\xE1-los envolve reduzir a tens\xE3o no momento, escolher local e hora adequados, descrever fatos sem r\xF3tulos, ouvir as necessidades de cada parte e construir acordos que tratem as causas.",paraRefletir:"Diante de um conflito, voc\xEA tende a evitar, enfrentar ou mediar? Em que situa\xE7\xF5es cada rea\xE7\xE3o ajuda ou atrapalha?"}];var Ne=[{id:"m10",eixo:"e3",numero:10,habilidade:"Pensamento cr\xEDtico",titulo:"\xC9 da idade?",objetivo:"Questionar uma explica\xE7\xE3o pronta, buscar evid\xEAncias e comunicar os dados de forma organizada para a decis\xE3o da equipe.",contexto:"Est\xE1gio supervisionado na cl\xEDnica m\xE9dica, in\xEDcio do turno da manh\xE3.",situacaoProblema:'Dona Rosa, de 79 anos, amanheceu confusa. A equipe atribui a confus\xE3o "\xE0 idade", mas no dia anterior ela estava orientada e conversando normalmente.',comportamentos:["Questiona pressupostos","Compara dados com a condi\xE7\xE3o anterior","Organiza as evid\xEAncias para comunicar"],local:"Cl\xEDnica m\xE9dica \xB7 ter\xE7a, 8h",cena:"enfermaria",personagens:["rosa","edson","marta","marcos"],medidor:"Clareza do racioc\xEDnio",etapas:[{id:"m10e1",situacao:[f('Na passagem de plant\xE3o, consta: "Dona Rosa, 79 anos, confusa e agitada durante a noite".'),i("rosa","preocupado","\xD4, meu bem, que lugar \xE9 esse? Cad\xEA minha casa? Eu preciso dar comida pras galinhas."),i("edson","neutro","Ela est\xE1 assim desde a madrugada. \xC9 da idade, idoso fica assim no hospital. N\xE3o esquenta."),f("Ontem \xE0 tarde, quando voc\xEA conversou com ela, Dona Rosa estava orientada e falante.")],desafio:"Qual \xE9 a sua atitude diante dessa informa\xE7\xE3o?",opcoes:[d("adequada","Verifico os sinais vitais, revejo os registros das \xFAltimas 24 horas e pergunto \xE0 fam\xEDlia como ela \xE9 em casa.",[f("Temperatura: 38,1 \xB0C. Nos registros, consta que ela urinou pouco e recusou \xE1gua durante a noite.")],'Pensamento cr\xEDtico \xE9 questionar explica\xE7\xF5es prontas e buscar evid\xEAncias. Uma confus\xE3o que surge de repente, em quem estava orientada, \xE9 um sinal de alerta que precisa ser investigado, e n\xE3o algo "da idade".'),d("parcial","Anoto a mudan\xE7a no meu caderno para perguntar \xE0 professora, no fim da manh\xE3, se esse quadro \xE9 esperado em pacientes idosos.",[f("Ao meio-dia, a confus\xE3o de Dona Rosa est\xE1 mais intensa.")],"Voc\xEA percebeu algo diferente e buscou orienta\xE7\xE3o, o que \xE9 positivo. Por\xE9m, uma mudan\xE7a aguda no estado mental pede verifica\xE7\xE3o e comunica\xE7\xE3o no momento, e n\xE3o no fim do turno."),d("pouco","Aceito a explica\xE7\xE3o do Sr. Edson, que tem muitos anos de experi\xEAncia com pacientes idosos internados.",[i("edson","neutro","Isso. Daqui a pouco ela acalma.")],"A experi\xEAncia dos colegas \xE9 valiosa, mas n\xE3o substitui a an\xE1lise dos dados do paciente. Aceitar uma explica\xE7\xE3o sem chec\xE1-la \xE9 justamente o que o pensamento cr\xEDtico ajuda a evitar."),d("inadequada","Pe\xE7o ao Sr. Edson que contenha Dona Rosa no leito, para evitar uma queda enquanto ela estiver agitada.",[i("edson","tenso","Conten\xE7\xE3o n\xE3o \xE9 assim, {nome}. Precisa de avalia\xE7\xE3o e indica\xE7\xE3o da equipe.")],"A preocupa\xE7\xE3o com quedas \xE9 v\xE1lida, mas a conten\xE7\xE3o \xE9 uma medida excepcional, que depende de avalia\xE7\xE3o e indica\xE7\xE3o da equipe, e n\xE3o trata a causa da confus\xE3o. O primeiro passo \xE9 investigar.")]},{id:"m10e2",situacao:[i("marta","preocupado","Minha m\xE3e \xE9 l\xFAcida! Ela mora sozinha, faz tudo. Nunca vi ela assim."),f("Voc\xEA verifica os dados: mudan\xE7a s\xFAbita em rela\xE7\xE3o a ontem, temperatura de 38,1 \xB0C, pouca urina e pouca ingest\xE3o de \xE1gua.")],desafio:"O que voc\xEA faz com essas informa\xE7\xF5es?",opcoes:[d("adequada","Comunico j\xE1 ao Enf. Marcos, de forma organizada: situa\xE7\xE3o, hist\xF3rico, dados levantados e o que me preocupa.",[i("marcos","preocupado","Bem observado. Mudan\xE7a aguda com febre precisa de avalia\xE7\xE3o m\xE9dica agora. Vou acionar a equipe.")],"Organizar as informa\xE7\xF5es (por exemplo, com a estrutura SBAR: situa\xE7\xE3o, breve hist\xF3rico, avalia\xE7\xE3o e recomenda\xE7\xE3o) torna a comunica\xE7\xE3o clara e r\xE1pida. Voc\xEA analisou os dados e levou a decis\xE3o a quem tem compet\xEAncia para tom\xE1-la."),d("parcial","Digo ao Enf. Marcos que Dona Rosa parece pior do que ontem e pergunto a ele o que acha da situa\xE7\xE3o.",[i("marcos","neutro","Pior como? Voc\xEA tem algum dado?")],"Comunicar foi o caminho certo, mas, sem os dados organizados, a mensagem perde for\xE7a e exige novas perguntas. Pensamento cr\xEDtico tamb\xE9m \xE9 saber apresentar as evid\xEAncias."),d("pouco",'Por conta pr\xF3pria, ofere\xE7o \xE1gua e o antit\xE9rmico prescrito "se necess\xE1rio", j\xE1 que a febre pode estar causando a confus\xE3o.',[i("marcos","tenso","{nome}, voc\xEA administrou sem falar comigo? Estudante s\xF3 administra medicamento sob supervis\xE3o.")],"Mesmo com prescri\xE7\xE3o, o estudante administra medicamentos sob supervis\xE3o. E tratar a febre n\xE3o substitui a avalia\xE7\xE3o da causa da confus\xE3o, que precisa ser comunicada."),d("inadequada","Explico \xE0 filha que deve ser uma infec\xE7\xE3o urin\xE1ria e que, com o tratamento, a confus\xE3o logo vai passar.",[i("marta","tenso","Infec\xE7\xE3o? Ningu\xE9m tinha me falado isso!")],"Levantar hip\xF3teses faz parte do racioc\xEDnio, mas comunic\xE1-las \xE0 fam\xEDlia como diagn\xF3stico ultrapassa o papel do estudante e pode gerar informa\xE7\xF5es incorretas.")]}],justificativa:'Pensamento cr\xEDtico envolve questionar pressupostos ("\xE9 da idade"), comparar dados com a condi\xE7\xE3o anterior, buscar evid\xEAncias e organizar as informa\xE7\xF5es para a decis\xE3o. Uma altera\xE7\xE3o aguda do estado mental em pessoas idosas pode indicar uma condi\xE7\xE3o cl\xEDnica que exige avalia\xE7\xE3o r\xE1pida.',paraRefletir:'Que "verdades da rotina" do seu campo de est\xE1gio voc\xEA j\xE1 ouviu e nunca checou? Como poderia verific\xE1-las?'},{id:"m11",eixo:"e3",numero:11,habilidade:"Reflex\xE3o",titulo:"Leito 8, leito 9",objetivo:"Analisar um quase erro com honestidade, identificar causas e transformar a experi\xEAncia em um plano de a\xE7\xE3o.",contexto:"Est\xE1gio na cl\xEDnica m\xE9dica, preparo e administra\xE7\xE3o de medicamentos sob supervis\xE3o.",situacaoProblema:"Voc\xEA quase administra um medicamento no paciente errado, que tinha nome parecido. O enfermeiro interv\xE9m a tempo e pede para conversar.",comportamentos:["Descreve o ocorrido com honestidade","Analisa causas pessoais e do processo","Define o que far\xE1 diferente"],local:"Cl\xEDnica m\xE9dica \xB7 quarta, 11h",cena:"enfermaria",personagens:["marcos","helena"],medidor:"Aprendizado com a experi\xEAncia",etapas:[{id:"m11e1",situacao:[f("Sob supervis\xE3o do Enf. Marcos, voc\xEA prepara a medica\xE7\xE3o do Sr. Jos\xE9 Carlos, do leito 8."),f("No quarto, voc\xEA se aproxima do leito 9, do Sr. Jos\xE9 Cl\xE1udio. Antes que voc\xEA comece, o Enf. Marcos interv\xE9m."),i("marcos","tenso","{nome}, espera. Confere a pulseira."),f("Era o paciente errado. Nada foi administrado."),i("marcos","neutro","Vamos conversar ali fora. O que aconteceu?")],desafio:"Como voc\xEA responde?",opcoes:[d("adequada","Descrevo o que fiz e onde a checagem falhou: n\xE3o conferi a pulseira e me guiei pelo nome parecido e pela pressa.",[i("marcos","aliviado","Obrigado pela clareza. Assim a gente entende o processo, e n\xE3o s\xF3 o erro.")],"Descrever o ocorrido com honestidade e identificar o ponto exato da falha \xE9 o in\xEDcio da reflex\xE3o sobre a pr\xE1tica. Um quase erro \xE9 uma oportunidade de aprendizagem para voc\xEA e para a equipe."),d("parcial","Pe\xE7o muitas desculpas ao Enf. Marcos e garanto que vou ter mais cuidado para que isso nunca mais aconte\xE7a.",[i("marcos","neutro","Entendo. Mas o que exatamente fez isso acontecer?")],"Reconhecer \xE9 importante, mas promessas n\xE3o explicam a causa. Sem analisar o que levou \xE0 falha, a chance de repeti-la continua a mesma."),d("pouco","Explico que os nomes s\xE3o muito parecidos e que os leitos deveriam estar mais bem identificados pela institui\xE7\xE3o.",[i("marcos","neutro","Isso tamb\xE9m \xE9 verdade. E na sua parte do processo?")],"Fatores do ambiente contribuem para erros e precisam ser considerados, mas a reflex\xE3o tamb\xE9m inclui a pr\xF3pria conduta. Olhar apenas para fora impede o aprendizado pessoal."),d("inadequada","Lembro que nenhum medicamento chegou a ser administrado, ent\xE3o, na pr\xE1tica, n\xE3o houve erro com o paciente.",[i("marcos","tenso","N\xE3o chegou ao paciente porque algu\xE9m interrompeu. Isso \xE9 um quase erro e precisa ser analisado.")],"Incidentes que n\xE3o chegam ao paciente (quase erros) revelam falhas no processo e s\xE3o valiosos para a seguran\xE7a. Minimizar o ocorrido impede que a li\xE7\xE3o seja aprendida.")]},{id:"m11e2",cena:"sala-aula",situacao:[f("\xC0 noite, voc\xEA escreve o di\xE1rio reflexivo do est\xE1gio, que ser\xE1 lido pela Profa. Helena.")],desafio:"Como voc\xEA escreve sobre o epis\xF3dio no di\xE1rio reflexivo?",opcoes:[d("adequada","Descrevo o fato, o que senti, por que a checagem falhou e o que farei diferente, relacionando ao protocolo de identifica\xE7\xE3o.",[f("Na semana seguinte, a Profa. Helena usa o seu relato, sem identificar ningu\xE9m, em uma discuss\xE3o com a turma sobre seguran\xE7a do paciente.")],"Uma boa reflex\xE3o percorre descri\xE7\xE3o, sentimentos, an\xE1lise, conclus\xE3o e plano de a\xE7\xE3o, como prop\xF5em modelos de ciclo reflexivo (por exemplo, o de Gibbs). Relacionar a experi\xEAncia a refer\xEAncias transforma o epis\xF3dio em aprendizagem."),d("parcial","Descrevo em detalhes tudo o que aconteceu, em ordem cronol\xF3gica, para que a professora entenda exatamente a situa\xE7\xE3o.",[i("helena","neutro","Bom relato. E o que voc\xEA aprendeu com isso?")],"A descri\xE7\xE3o \xE9 o primeiro passo, mas, sozinha, n\xE3o \xE9 reflex\xE3o. Faltou analisar causas, sentimentos e o que muda na sua pr\xE1tica."),d("pouco","Escrevo com sinceridade que o dia foi horr\xEDvel e que talvez eu n\xE3o tenha jeito para essa profiss\xE3o.",[f("A Profa. Helena marca uma conversa com voc\xEA para a semana seguinte.")],"Registrar sentimentos faz parte da reflex\xE3o, mas generalizar um epis\xF3dio como incapacidade pessoal n\xE3o ajuda a aprender. Erros e quase erros acontecem e precisam ser analisados com equil\xEDbrio."),d("inadequada","Prefiro n\xE3o registrar o epis\xF3dio no di\xE1rio, porque ele j\xE1 foi resolvido com o enfermeiro e poderia prejudicar minha avalia\xE7\xE3o.",[i("helena","preocupado","O Enf. Marcos me contou sobre o quase erro. Por que ele n\xE3o aparece no seu di\xE1rio?")],"Omitir experi\xEAncias dif\xEDceis esvazia a fun\xE7\xE3o do di\xE1rio reflexivo e contraria a cultura de seguran\xE7a, que depende da notifica\xE7\xE3o e da discuss\xE3o de incidentes.")]}],justificativa:"Refletir sobre a pr\xE1tica \xE9 examinar a pr\xF3pria experi\xEAncia para compreend\xEA-la e transform\xE1-la. Na seguran\xE7a do paciente, refletir sobre quase erros, sem culpabiliza\xE7\xE3o e sem minimiza\xE7\xE3o, fortalece pr\xE1ticas como a confer\xEAncia de pelo menos dois identificadores, prevista no Protocolo de Identifica\xE7\xE3o do Paciente.",paraRefletir:"Que situa\xE7\xE3o do seu est\xE1gio voc\xEA ainda n\xE3o analisou com calma? O que a sua descri\xE7\xE3o, sozinha, n\xE3o explica?"},{id:"m12",eixo:"e3",numero:12,habilidade:"Resolu\xE7\xE3o de problemas",titulo:"O grupo que esvaziou",objetivo:"Definir o problema, investigar causas com dados, propor alternativas e avaliar os resultados antes de decidir.",contexto:"Est\xE1gio na Unidade B\xE1sica de Sa\xFAde, apoio ao grupo de pessoas com hipertens\xE3o.",situacaoProblema:"O grupo de hipertensos da UBS, que reunia 30 pessoas, passou a receber cinco. A enfermeira pede ajuda aos estudantes para entender o que aconteceu.",comportamentos:["Investiga causas antes de propor solu\xE7\xF5es","Gera alternativas a partir dos dados","Testa e avalia os resultados"],local:"UBS Jardim das Flores \xB7 quinta, 13h",cena:"ubs",personagens:["tania","bia","joaquim"],medidor:"Efetividade da solu\xE7\xE3o",etapas:[{id:"m12e1",situacao:[f("O grupo de hipertensos, que acontece \xE0s quintas \xE0s 14h, tinha 30 participantes e agora recebe cinco."),i("tania","preocupado","Quero que voc\xEAs me ajudem a entender por que o grupo esvaziou e o que podemos fazer."),i("bia","neutro","Acho que \xE9 desinteresse. Vamos fazer um cartaz mais chamativo!")],desafio:"Por onde voc\xEA come\xE7a?",opcoes:[d("adequada","Proponho ouvir os participantes e quem deixou de ir, ver as listas de presen\xE7a e falar com os agentes comunit\xE1rios.",[f("Em uma semana, voc\xEAs ouvem 18 usu\xE1rios. Motivos mais citados: hor\xE1rio de muito calor, coincid\xEAncia com o trabalho e encontros s\xF3 com palestras.")],"Resolver problemas come\xE7a por defini-los bem e investigar as causas com dados. Solu\xE7\xF5es escolhidas antes do diagn\xF3stico costumam atacar o problema errado."),d("parcial","Sugiro fazer o cartaz e, ao mesmo tempo, perguntar a todos que vierem ao grupo o que acham dos encontros e do hor\xE1rio.",[f("O cartaz fica bonito, mas s\xF3 os cinco participantes de sempre respondem \xE0 pergunta.")],"Coletar opini\xF5es \xE9 positivo, mas ouvir apenas quem ainda frequenta deixa de fora justamente quem deixou de ir, que tem a informa\xE7\xE3o mais importante."),d("pouco","Concordo com a ideia do cartaz, porque \xE9 uma solu\xE7\xE3o r\xE1pida, barata e que pode ser feita ainda nesta semana.",[f("Duas semanas depois, o grupo continua com cinco participantes.")],'A solu\xE7\xE3o \xE9 r\xE1pida, mas parte de um pressuposto n\xE3o verificado (o "desinteresse"). Sem conhecer as causas, o esfor\xE7o pode n\xE3o ter efeito.'),d("inadequada","Sugiro encerrar o grupo e usar o hor\xE1rio para consultas individuais, j\xE1 que a ades\xE3o est\xE1 muito baixa.",[i("tania","triste","Encerrar? Esse grupo era importante para o acompanhamento deles.")],"Abandonar uma estrat\xE9gia sem investigar o problema descarta um espa\xE7o de cuidado que funcionava. Baixa ades\xE3o \xE9 um problema a ser analisado, e n\xE3o uma conclus\xE3o.")]},{id:"m12e2",cena:"reuniao",situacao:[f("Com os dados em m\xE3os, a equipe se re\xFAne. Os principais motivos foram hor\xE1rio, trabalho e formato de palestra."),i("tania","neutro","E agora? O que voc\xEAs prop\xF5em?")],desafio:"Qual proposta voc\xEA leva?",opcoes:[d("adequada","Testar por um m\xEAs um encontro cedo e outro no fim da tarde, com atividades participativas, e avaliar a presen\xE7a.",[f("Ap\xF3s um m\xEAs, a m\xE9dia de presen\xE7a sobe para 19 participantes. A equipe decide manter o novo formato e reavaliar em tr\xEAs meses.")],"Gerar alternativas a partir das causas, testar em pequena escala e avaliar os resultados \xE9 a l\xF3gica dos ciclos de melhoria (planejar, fazer, verificar e agir). Assim, a decis\xE3o final se apoia em resultados."),d("parcial","Mudar definitivamente o hor\xE1rio para o in\xEDcio da manh\xE3, que foi o hor\xE1rio mais pedido pelos usu\xE1rios ouvidos.",[f("A presen\xE7a melhora um pouco, mas quem trabalha pela manh\xE3 continua sem conseguir ir.")],"A proposta responde a uma das causas, mas \xE9 implantada sem teste e sem considerar todos os grupos. Avaliar o efeito permitiria ajustar a solu\xE7\xE3o."),d("pouco","Manter o hor\xE1rio atual e convidar um palestrante conhecido na cidade para atrair mais p\xFAblico ao grupo.",[f("No dia da palestra, v\xEAm 12 pessoas. Na semana seguinte, cinco.")],"A solu\xE7\xE3o n\xE3o corresponde \xE0s causas encontradas (hor\xE1rio e formato). Um atrativo pontual n\xE3o resolve barreiras que se repetem toda semana."),d("inadequada","Fazer visitas aos usu\xE1rios que faltaram, lembrando a import\xE2ncia de participar do grupo para controlar a press\xE3o.",[i("joaquim","tenso","Eu trabalho at\xE9 as cinco. N\xE3o \xE9 quest\xE3o de querer.")],"Cobrar presen\xE7a sem mudar as condi\xE7\xF5es que impedem a participa\xE7\xE3o responsabiliza os usu\xE1rios por um problema do servi\xE7o e pode afast\xE1-los ainda mais.")]}],justificativa:"Resolu\xE7\xE3o de problemas \xE9 um processo: definir o problema, investigar causas com dados, gerar alternativas, testar e avaliar. Na Aten\xE7\xE3o Prim\xE1ria, envolver os usu\xE1rios na identifica\xE7\xE3o das causas aumenta a chance de solu\xE7\xF5es efetivas.",paraRefletir:"Pense em um problema do seu campo de est\xE1gio. Que dado voc\xEA precisaria coletar antes de propor qualquer solu\xE7\xE3o?"},{id:"m13",eixo:"e3",numero:13,habilidade:"Tomada de decis\xE3o",titulo:"Tr\xEAs chamados ao mesmo tempo",objetivo:"Priorizar demandas pelo risco, delegar com clareza e tomar decis\xF5es seguras dentro dos limites de atua\xE7\xE3o do estudante.",contexto:"Est\xE1gio na cl\xEDnica m\xE9dica, com o enfermeiro supervisor atendendo uma intercorr\xEAncia em outro quarto.",situacaoProblema:"Tr\xEAs demandas chegam ao mesmo tempo, uma delas com sinais de instabilidade respirat\xF3ria. Em seguida, voc\xEA precisa decidir o que fazer at\xE9 o enfermeiro chegar.",comportamentos:["Prioriza pelo risco","Delega e comunica as demais demandas","Age dentro dos limites e aciona a supervis\xE3o"],local:"Cl\xEDnica m\xE9dica \xB7 sexta, 14h",cena:"enfermaria",personagens:["lauro","edson","marcos"],medidor:"Seguran\xE7a do paciente",etapas:[{id:"m13e1",cena:"corredor",situacao:[f("O Enf. Marcos est\xE1 em outro quarto, atendendo uma intercorr\xEAncia. Tr\xEAs situa\xE7\xF5es chegam at\xE9 voc\xEA ao mesmo tempo."),f("Seu Lauro, do leito 5, chama: est\xE1 com falta de ar repentina e agitado. Dona Cida, do leito 4, pede ajuda para ir ao banheiro. No balc\xE3o, um familiar pede os pap\xE9is da alta."),i("edson","neutro","Estou terminando um banho aqui do lado. O que voc\xEA precisa?")],desafio:"Como voc\xEA prioriza?",opcoes:[d("adequada","Vou at\xE9 o Seu Lauro e pe\xE7o ao Sr. Edson que avise o enfermeiro e ajude Dona Cida. Aviso o familiar que j\xE1 atendo.",[i("edson","neutro","J\xE1 estou chamando o Marcos e levo a Dona Cida em seguida."),f("Voc\xEA chega ao leito 5. Seu Lauro est\xE1 sentado, respirando r\xE1pido.")],"A falta de ar repentina \xE9 a situa\xE7\xE3o de maior risco, por isso vem primeiro. Pedir ajuda e delegar as outras demandas garante que nenhuma fique abandonada."),d("parcial","Vou direto at\xE9 o Seu Lauro, que parece o caso mais grave, e deixo as outras demandas para quando ele estiver est\xE1vel.",[f("Dona Cida, cansada de esperar, tenta ir sozinha ao banheiro e precisa se apoiar na parede.")],"A prioridade foi correta, mas deixar as outras demandas sem encaminhamento cria novos riscos, como o de queda. Priorizar inclui delegar e comunicar."),d("pouco","Ajudo primeiro Dona Cida, que leva s\xF3 dois minutos, e em seguida vou ver o Seu Lauro com calma.",[f("Quando voc\xEA chega ao leito 5, Seu Lauro est\xE1 mais agitado e suando.")],"Resolver primeiro o que \xE9 r\xE1pido parece eficiente, mas a ordem deve seguir o risco. Uma altera\xE7\xE3o respirat\xF3ria aguda n\xE3o pode esperar."),d("inadequada","Entrego os pap\xE9is da alta primeiro, porque o familiar est\xE1 esperando no balc\xE3o h\xE1 mais tempo que os outros.",[f("Enquanto voc\xEA procura os pap\xE9is, a campainha do leito 5 toca sem parar.")],"Ordem de chegada n\xE3o \xE9 crit\xE9rio de prioridade no cuidado. Demandas administrativas podem esperar; sinais de instabilidade cl\xEDnica, n\xE3o.")]},{id:"m13e2",situacao:[f("No leito 5, Seu Lauro respira r\xE1pido. O ox\xEDmetro marca 88%. Ele usa cateter nasal de oxig\xEAnio, com fluxo prescrito. O Enf. Marcos est\xE1 a caminho."),i("lauro","tenso","N\xE3o t\xF4 conseguindo puxar o ar...")],desafio:"Enquanto o enfermeiro n\xE3o chega, o que voc\xEA faz?",opcoes:[d("adequada","Fico com ele, elevo a cabeceira, confiro o cateter e os sinais vitais e organizo os dados para o Enf. Marcos.",[i("lauro","aliviado","Assim sentado melhora um pouco..."),i("marcos","neutro","O que temos, {nome}?"),f("Voc\xEA relata os dados de forma objetiva. O Enf. Marcos assume e aciona a equipe m\xE9dica.")],"Voc\xEA tomou decis\xF5es dentro do seu papel: medidas simples e seguras, monitoramento e preparo das informa\xE7\xF5es. Decidir bem tamb\xE9m \xE9 saber o que n\xE3o decidir por conta pr\xF3pria."),d("parcial","Saio do quarto para buscar o Enf. Marcos pessoalmente e garantir que ele venha o mais r\xE1pido poss\xEDvel.",[f("Por dois minutos, Seu Lauro fica sozinho e cada vez mais ansioso.")],"A inten\xE7\xE3o \xE9 garantir ajuda, mas o enfermeiro j\xE1 tinha sido acionado. Deixar um paciente inst\xE1vel sozinho aumenta o risco; o melhor \xE9 permanecer e pedir que outra pessoa chame, se necess\xE1rio."),d("pouco","Aguardo o enfermeiro chegar sem mexer em nada, para n\xE3o correr o risco de fazer algo errado com o paciente.",[f("Seu Lauro continua deitado, com a cabeceira baixa, e mais ansioso.")],"Prud\xEAncia \xE9 importante, mas h\xE1 medidas simples e seguras que o estudante pode e deve adotar, como posicionar o paciente e checar os dispositivos. N\xE3o decidir tamb\xE9m \xE9 uma decis\xE3o."),d("inadequada","Aumento o fluxo de oxig\xEAnio por conta pr\xF3pria, j\xE1 que a satura\xE7\xE3o est\xE1 baixa e o enfermeiro ainda n\xE3o chegou.",[i("marcos","tenso","{nome}, quem alterou o fluxo? Isso depende de avalia\xE7\xE3o e prescri\xE7\xE3o.")],"Alterar uma terapia sem prescri\xE7\xE3o e sem supervis\xE3o ultrapassa o limite de atua\xE7\xE3o do estudante e pode trazer riscos ao paciente. Na urg\xEAncia, a decis\xE3o adequada \xE9 monitorar, adotar medidas seguras e acionar quem tem compet\xEAncia.")]}],justificativa:"Tomar decis\xF5es no cuidado envolve priorizar pelo risco, considerar os recursos dispon\xEDveis, delegar com clareza e reconhecer os limites da pr\xF3pria atua\xE7\xE3o. Para o estudante, decidir bem inclui adotar medidas seguras e acionar a supervis\xE3o no momento certo.",paraRefletir:"Quando v\xE1rias demandas chegam juntas, qual crit\xE9rio voc\xEA usa de fato para escolher a primeira? Ele \xE9 o mais seguro?"}];var Ce=[{id:"m14",eixo:"e4",numero:14,habilidade:"Autonomia",titulo:"Primeiro curativo",objetivo:"Assumir a responsabilidade pela pr\xF3pria prepara\xE7\xE3o e reconhecer, durante a pr\xE1tica, os momentos que exigem consulta \xE0 supervis\xE3o.",contexto:"Prepara\xE7\xE3o para o primeiro curativo em ferida cir\xFArgica no est\xE1gio supervisionado.",situacaoProblema:"Voc\xEA far\xE1 um curativo pela primeira vez na segunda-feira. Um colega sugere esperar a demonstra\xE7\xE3o da professora. Durante o procedimento, surge um achado inesperado.",comportamentos:["Busca fontes confi\xE1veis por conta pr\xF3pria","Pratica e identifica as pr\xF3prias d\xFAvidas","Reconhece limites e consulta no momento certo"],local:"Laborat\xF3rio de habilidades \xB7 sexta, 16h",cena:"laboratorio",personagens:["rafael","helena"],medidor:"Preparo para a pr\xE1tica",etapas:[{id:"m14e1",situacao:[f("Na segunda-feira, voc\xEA far\xE1 pela primeira vez, sob supervis\xE3o, um curativo em uma ferida cir\xFArgica."),i("rafael","neutro","Relaxa. Na hora a professora mostra como faz. Eu nem vou estudar.")],desafio:"Como voc\xEA se prepara?",opcoes:[d("adequada","Reviso o protocolo da institui\xE7\xE3o e o material da disciplina, pratico no laborat\xF3rio e anoto minhas d\xFAvidas.",[f("No laborat\xF3rio, voc\xEA percebe que tem d\xFAvida sobre a sequ\xEAncia de limpeza da ferida e anota para perguntar.")],"Autonomia na forma\xE7\xE3o \xE9 assumir a responsabilidade pela pr\xF3pria aprendizagem: buscar fontes confi\xE1veis, praticar e identificar as pr\xF3prias d\xFAvidas antes da pr\xE1tica real."),d("parcial","Assisto a v\xEDdeos de curativo na internet durante o fim de semana, para chegar com a t\xE9cnica bem visualizada.",[f("Voc\xEA assiste a tr\xEAs v\xEDdeos com t\xE9cnicas diferentes e fica em d\xFAvida sobre qual seguir.")],"Buscar conhecimento por conta pr\xF3pria \xE9 positivo, mas fontes sem crit\xE9rio de qualidade podem divergir do protocolo da institui\xE7\xE3o. Autonomia inclui escolher boas fontes."),d("pouco","Combino com o Rafael de esperar a demonstra\xE7\xE3o da professora na segunda, que vai mostrar o jeito certo de fazer.",[i("rafael","feliz","Isso! Sem estresse.")],"Contar apenas com a demonstra\xE7\xE3o no dia transfere toda a responsabilidade da aprendizagem para a professora e aumenta a inseguran\xE7a na hora do procedimento."),d("inadequada","Pe\xE7o para ficar com outro paciente, sem curativo, para n\xE3o colocar ningu\xE9m em risco com a minha inexperi\xEAncia.",[i("helena","preocupado","{nome}, essa \xE9 uma oportunidade importante para voc\xEA.")],"Evitar a situa\xE7\xE3o adia o desenvolvimento da compet\xEAncia. A inseguran\xE7a diminui com preparo e pr\xE1tica supervisionada, e n\xE3o com a fuga da experi\xEAncia.")]},{id:"m14e2",cena:"enfermaria",situacao:[f("Segunda-feira, no est\xE1gio. O material est\xE1 separado."),i("helena","neutro","Pode come\xE7ar. Estou aqui, mas quero ver voc\xEA conduzir."),f("Ao retirar o curativo anterior, voc\xEA percebe uma secre\xE7\xE3o diferente do que esperava e fica em d\xFAvida se pode continuar.")],desafio:"O que voc\xEA faz?",opcoes:[d("adequada","Interrompo, descrevo \xE0 professora o que observei e pergunto como proceder antes de continuar.",[i("helena","feliz","\xD3tima observa\xE7\xE3o. Vamos avaliar juntos e registrar esse aspecto da ferida.")],"Autonomia n\xE3o \xE9 fazer tudo sem ajuda: \xE9 conduzir com responsabilidade e reconhecer quando \xE9 preciso consultar. Comunicar o achado protege o paciente e qualifica o registro."),d("parcial","Continuo o curativo como planejado, para n\xE3o deixar a ferida exposta, e comento a secre\xE7\xE3o com a professora no final.",[i("helena","neutro","Essa observa\xE7\xE3o precisava vir antes de voc\xEA continuar.")],"Voc\xEA comunicou o achado, o que \xE9 importante, mas no momento errado. Altera\xE7\xF5es na ferida podem mudar a conduta e precisam ser avaliadas antes de seguir."),d("pouco","Pe\xE7o que a professora termine o curativo, porque perdi a seguran\xE7a depois de ver a secre\xE7\xE3o.",[i("helena","neutro","Posso ajudar, mas quero que voc\xEA continue comigo.")],"Reconhecer a inseguran\xE7a \xE9 honesto, mas entregar o procedimento abre m\xE3o da oportunidade de aprender com supervis\xE3o. Perguntar e continuar seria o caminho."),d("inadequada","Decido por conta pr\xF3pria trocar a cobertura por outra que, pelo que lembro da aula, \xE9 indicada para secre\xE7\xE3o.",[i("helena","tenso","Espera. A escolha da cobertura depende da avalia\xE7\xE3o da ferida e do protocolo.")],"Tomar uma decis\xE3o terap\xEAutica sem avalia\xE7\xE3o e sem consulta confunde autonomia com independ\xEAncia. Na forma\xE7\xE3o, a autonomia se desenvolve dentro da supervis\xE3o.")]}],justificativa:"Autonomia, na forma\xE7\xE3o em Enfermagem, \xE9 a capacidade de dirigir a pr\xF3pria aprendizagem e atua\xE7\xE3o com responsabilidade: preparar-se, buscar fontes confi\xE1veis, praticar e reconhecer os limites que exigem consulta e supervis\xE3o.",paraRefletir:"Na pr\xF3xima pr\xE1tica, qual procedimento voc\xEA pode estudar e treinar antes, sem esperar que algu\xE9m pe\xE7a?"},{id:"m15",eixo:"e4",numero:15,habilidade:"Iniciativa",titulo:"Sol, prato e lua",objetivo:"Perceber uma necessidade n\xE3o solicitada, propor uma a\xE7\xE3o e implement\xE1-la com planejamento e valida\xE7\xE3o da equipe.",contexto:"Est\xE1gio na Unidade B\xE1sica de Sa\xFAde, em uma tarde com menos demandas para os estudantes.",situacaoProblema:"Suas atividades terminaram mais cedo. Na sala de espera, voc\xEA ouve um usu\xE1rio idoso dizer que se confunde com os hor\xE1rios dos rem\xE9dios.",comportamentos:["Identifica necessidades sem ser solicitado","Prop\xF5e a\xE7\xF5es e comunica \xE0 equipe","Valida e testa antes de ampliar"],local:"UBS Jardim das Flores \xB7 quarta, 15h",cena:"ubs",personagens:["joaquim","tania"],medidor:"Contribui\xE7\xE3o para o cuidado",etapas:[{id:"m15e1",situacao:[f("Suas atividades do dia terminaram mais cedo. A equipe est\xE1 ocupada com a fila da farm\xE1cia."),f("Na sala de espera, voc\xEA ouve Seu Joaquim comentar com outra usu\xE1ria que confunde os hor\xE1rios dos rem\xE9dios."),i("joaquim","preocupado","S\xE3o quatro rem\xE9dios. Um \xE9 de manh\xE3, outro \xE9 de doze em doze... Eu me perco todo.")],desafio:"O que voc\xEA faz com o tempo livre e com o que ouviu?",opcoes:[d("adequada","Conto \xE0 Enf. T\xE2nia o que ouvi do Seu Joaquim e proponho conversar com ele, com a orienta\xE7\xE3o dela.",[i("tania","feliz","Que bom que voc\xEA reparou. Vai l\xE1, e depois me conta o que viu.")],"Iniciativa \xE9 agir antes de ser solicitado, identificando necessidades e oportunidades. Combinar com a enfermeira garante que a a\xE7\xE3o seja integrada ao trabalho da equipe."),d("parcial","Ofere\xE7o ajuda na fila da farm\xE1cia, que est\xE1 grande, j\xE1 que \xE9 ali que a equipe mais precisa agora.",[i("tania","neutro","Ajuda, sim. Obrigada."),f("Seu Joaquim vai embora sem que ningu\xE9m fale com ele.")],"Oferecer ajuda \xE0 equipe \xE9 uma boa atitude, mas a necessidade que voc\xEA identificou ficou sem resposta. Iniciativa tamb\xE9m \xE9 dar visibilidade ao que s\xF3 voc\xEA percebeu."),d("pouco","Aguardo que algu\xE9m me passe uma nova tarefa, para n\xE3o atrapalhar a rotina da equipe com algo fora do combinado.",[f("Ningu\xE9m lembra de voc\xEA por 40 minutos.")],"Esperar instru\xE7\xF5es parece seguro, mas desperdi\xE7a oportunidades de aprendizagem e de cuidado. Em campo, a iniciativa do estudante \xE9 valorizada quando vem acompanhada de comunica\xE7\xE3o."),d("inadequada","Aproveito o tempo livre para revisar o conte\xFAdo da prova no celular at\xE9 o fim do hor\xE1rio de est\xE1gio.",[f("Seu Joaquim passa por voc\xEA e pergunta algo, mas voc\xEA n\xE3o percebe.")],"O tempo em campo \xE9 tempo de aprendizagem e de cuidado. Desconectar-se do ambiente impede de perceber necessidades que est\xE3o bem \xE0 sua frente.")]},{id:"m15e2",situacao:[f("Conversando com Seu Joaquim, voc\xEA percebe que outros idosos t\xEAm a mesma dificuldade e tem uma ideia: uma tabela com desenhos (sol, prato e lua) para indicar os hor\xE1rios."),i("joaquim","feliz","Com desenho eu entendo! Faz uma dessas pra mim?")],desafio:"Como voc\xEA leva a ideia adiante?",opcoes:[d("adequada","Fa\xE7o um modelo, pe\xE7o \xE0 Enf. T\xE2nia que confira com as prescri\xE7\xF5es e proponho testar com alguns idosos.",[i("tania","feliz","Excelente. Vamos validar com o farmac\xEAutico
